<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>«Демо-опт» (учёт среднего бизнеса): EsepDos</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Пример управленческого учёта среднего бизнеса: платёжный календарь, дебиторка, прибыль по направлениям, налоги. Данные из 1С и банков.">
<style>
  :root{--teal:#1f9e90;--tealbg:#e8f6f4;--ink:#12161c;--hint:#5b6470;--line:#e4e7eb;--bg:#f6f7f9;--card:#fff;--red:#d64545;--redbg:#fdecec;--amber:#b7791f;--amberbg:#fdf4e3}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
  .top{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px}
  .top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .back{font-size:14px;color:var(--teal);text-decoration:none;font-weight:600}
  .badge{font-size:11px;font-weight:700;color:var(--amber);background:var(--amberbg);padding:3px 8px;border-radius:999px}
  .ttl{font-size:19px;font-weight:700;margin-top:6px}
  .src{font-size:12px;color:var(--hint)}
  .role{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
  .promo{margin:12px 16px 0;background:#f4c542;color:#1a1a1a;font-weight:800;font-size:16px;line-height:1.35;padding:12px 14px;border-radius:14px;box-shadow:0 6px 18px rgba(244,197,66,.35)}
  main{padding:14px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .tile .l{font-size:12px;color:var(--hint)} .tile .v{font-size:20px;font-weight:700;margin-top:2px} .tile .n{font-size:12px;color:var(--hint);margin-top:2px}
  .tile.hl{background:var(--tealbg);border-color:transparent} .tile.hl .v{color:#11665c}
  .tile.bad{background:var(--redbg);border-color:transparent} .tile.bad .v{color:var(--red)}
  h3{font-size:16px;margin:4px 0 10px}
  .muted{color:var(--hint);font-size:13px}
  .line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .line:first-of-type{border-top:0} .line b{white-space:nowrap}
  .line.tot{font-weight:700;border-top:2px solid var(--ink)}
  .line.sub{padding-left:12px;color:var(--hint);font-size:13px}
  .neg{color:var(--red)} .pos{color:#11665c} .warn{color:var(--amber)}
  .chip{flex:none;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .p-ok{background:var(--tealbg);color:#11665c} .p-warn{background:var(--amberbg);color:var(--amber)} .p-no{background:var(--redbg);color:var(--red)} .p-wait{background:#eef2f7;color:#475569}
  .day{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;font-weight:700;font-size:14px}
  .op{display:flex;justify-content:space-between;gap:8px;padding:6px 0 6px 10px;border-left:3px solid var(--line);font-size:14px;margin-left:2px}
  .op.in{border-left-color:var(--teal)} .op.out{border-left-color:#c9ced6} .op.tax{border-left-color:var(--amber)}
  .op .who{color:var(--ink)} .op .who small{display:block;color:var(--hint);font-size:12px}
  .alert{background:var(--redbg);border-radius:14px;padding:12px;margin-bottom:12px;color:#7a1d1d;font-size:14px}
  .alert.ok{background:var(--tealbg);color:#1d4a45}
  .alert b{display:block;font-size:15px;margin-bottom:4px}
  .btn{display:block;width:100%;text-align:center;font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:12px;border:0;cursor:pointer;margin-top:8px;text-decoration:none}
  .btn-teal{background:var(--teal);color:#fff} .btn-ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
  .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
  .row2:first-child{border-top:0}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
  .bar i{display:block;height:100%;background:var(--teal)}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .nav .in{max-width:480px;margin:0 auto;display:flex}
  .nav button{flex:1;border:0;background:none;font-family:inherit;font-size:11px;color:var(--hint);padding:4px 0;cursor:pointer}
  .nav button span{display:block;font-size:20px;line-height:1.2}
  .nav button.on{color:var(--teal);font-weight:700}
  .nav button.hide{display:none}
  .sheet{position:fixed;inset:0;background:rgba(18,22,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet.open{display:flex}
  .sheet .box{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
  .close{float:right;border:0;background:#fff;border-radius:999px;width:32px;height:32px;font-size:18px;cursor:pointer}
  .note{background:var(--tealbg);color:#1d4a45;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:10px 14px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%}
  .toast.on{opacity:1}
  svg text{font-family:inherit}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="row"><a class="back" href="./">‹ О сервисе и цены</a><span class="badge">ДЕМО · данные вымышленные</span></div>
    <div class="ttl">ТОО «Демо-Опт» · оптовая торговля</div>
    <div class="src">🔄 Данные из 1С и банков · обновлено сегодня в 09:00</div>
    <div class="role" id="roles"></div>
  </div>
  <div class="promo">✨ Это пример. Под ваш бизнес сделаем свою версию: ваши статьи, отчёты и нужные именно вам функции.</div>
  <main id="view"></main>
</div>
<nav class="nav"><div class="in">
  <button data-t="home" class="on"><span>📊</span>Сводка</button>
  <button data-t="cal"><span>🗓️</span>Календарь</button>
  <button data-t="ar"><span>📥</span>Дебиторка</button>
  <button data-t="pl"><span>📈</span>Прибыль</button>
  <button data-t="tax"><span>🏛️</span>Налоги</button>
</div></nav>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script>
// Демо учёта среднего бизнеса: всё считается в браузере, данные вымышленные, ничего не сохраняется.
(function () {
  const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g, ' ');
  const tg = n => fmt(n) + ' ₸';
  const mln = n => (n / 1e6).toFixed(1).replace('.', ',') + ' млн';
  const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const DAYS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const D = (m, d) => new Date(2026, m - 1, d);
  const TODAY = D(11, 27);
  const dn = d => d.getDate() + ' ' + MON[d.getMonth()] + ', ' + DAYS[d.getDay()];
  const ds = d => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');

  const BANKS = [['Halyk Bank', 8800000], ['Kaspi Business', 3100000], ['Freedom Bank', 1200000]];
  const START = BANKS.reduce((t, b) => t + b[1], 0);
  const MINCASH = 5000000;

  // дебиторка: клиенты с отсрочкой
  const AR = [
    { n: 'ТОО «Север-Маркет»', mgr: 'Ержан', sum: 4100000, due: D(11, 15), plan: D(12, 3) },
    { n: 'ИП Сапарова (сеть «Береке»)', mgr: 'Ержан', sum: 2600000, due: D(11, 25), plan: D(12, 1) },
    { n: 'ТОО «Аптека Плюс»', mgr: 'Гульмира', sum: 6800000, due: D(12, 2), plan: D(12, 2) },
    { n: 'ТОО «Юг-Дистрибуция»', mgr: 'Гульмира', sum: 9400000, due: D(12, 10), plan: D(12, 14) },
    { n: 'ТОО «Мега Строй»', mgr: 'Ержан', sum: 3200000, due: D(10, 20), plan: D(12, 20) },
    { n: 'ИП Жумабеков', mgr: 'Айбек', sum: 1150000, due: D(12, 5), plan: D(12, 5) },
    { n: 'ТОО «Казахмыс Снаб»', mgr: 'Айбек', sum: 12500000, due: D(12, 18), plan: D(12, 18) },
    { n: 'ТОО «Алатау Фуд»', mgr: 'Гульмира', sum: 5300000, due: D(12, 24), plan: D(12, 24) },
  ];
  // платежи
  const OUT = [
    { d: D(11, 30), n: 'Аренда склада', c: 'Аренда', s: 1500000 },
    { d: D(12, 1), n: 'ТОО «Поставщик-Алматы»', c: 'Поставщики', s: 7200000 },
    { d: D(12, 4), n: 'Зарплата за ноябрь', c: 'ФОТ', s: 9800000 },
    { d: D(12, 8), n: 'Логистика, ТК «Жол»', c: 'Логистика', s: 1300000 },
    { d: D(12, 11), n: 'Импорт: оплата поставщику (Китай)', c: 'Поставщики', s: 22000000, movable: D(12, 19) },
    { d: D(12, 15), n: 'Кредит Halyk: платёж', c: 'Кредит', s: 2200000 },
    { d: D(12, 22), n: 'ТОО «Поставщик-Алматы»', c: 'Поставщики', s: 6400000 },
    { d: D(12, 25), n: 'Зарплатные налоги за ноябрь', c: 'Налоги', s: 3400000, tax: 1 },
    { d: D(12, 25), n: 'КПН: авансовый платёж', c: 'Налоги', s: 900000, tax: 1 },
    { d: D(12, 30), n: 'Аренда склада', c: 'Аренда', s: 1500000 },
  ];
  // поступления: по дебиторке + текущие продажи (наличные клиенты, Kaspi)
  const DAILY = [0, 700000, 750000, 650000, 800000, 700000, 600000]; // по дням недели
  let moved = false, reminded = {};

  function flows() {
    const days = [];
    for (let k = 0; k <= 34; k++) {
      const d = new Date(TODAY); d.setDate(d.getDate() + k);
      const ins = AR.filter(a => +a.plan === +d && !(a.mgr === 'Ержан' && a.n.includes('Мега') && !reminded['Мега'])).map(a => ({ n: a.n, s: a.sum, c: 'Оплата клиента' }));
      if (reminded['Мега'] && +d === +D(12, 11)) ins.push({ n: 'ТОО «Мега Строй» (после напоминания)', s: 3200000, c: 'Оплата клиента' });
      if (k > 0 && DAILY[d.getDay()]) ins.push({ n: 'Текущие продажи', s: DAILY[d.getDay()], c: 'Продажи без отсрочки' });
      const outs = OUT.map(o => ({ ...o, d: (moved && o.movable) ? o.movable : o.d })).filter(o => +o.d === +d);
      days.push({ d, ins, outs });
    }
    let bal = START;
    days.forEach(x => { x.in = x.ins.reduce((t, o) => t + o.s, 0); x.out = x.outs.reduce((t, o) => t + o.s, 0); bal += x.in - x.out; x.bal = bal; });
    return days;
  }

  let ROLE = 'own', tab = 'home';
  const ROLES = { own: ['Собственник', ['home', 'cal', 'ar', 'pl', 'tax']], com: ['Коммерческий директор', ['home', 'ar', 'pl']], acc: ['Бухгалтер', ['cal', 'ar', 'tax']] };
  const V = document.getElementById('view');
  const toast = t => { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2500); };

  function head() {
    document.getElementById('roles').innerHTML = '<span class="muted" style="flex:none">Смотрю как:</span>' + Object.entries(ROLES).map(([k, [n]]) => `<button class="chip ${ROLE === k ? 'on' : ''}" data-r="${k}">${n}</button>`).join('');
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { ROLE = b.dataset.r; if (!ROLES[ROLE][1].includes(tab)) tab = ROLES[ROLE][1][0]; render(); toast(ROLE === 'own' ? 'Собственник видит всё' : ROLE === 'com' ? 'Коммерческий директор: продажи, дебиторка, маржа' : 'Бухгалтер: платежи, налоги, дебиторка'); });
    document.querySelectorAll('.nav button').forEach(b => { b.classList.toggle('hide', !ROLES[ROLE][1].includes(b.dataset.t)); b.classList.toggle('on', b.dataset.t === tab); });
  }

  function chart(days) {
    const W = 440, H = 150, P = 6, max = Math.max(...days.map(x => x.bal), START), min = Math.min(0, ...days.map(x => x.bal));
    const x = i => P + i * (W - 2 * P) / (days.length - 1), y = v => P + (max - v) * (H - 2 * P - 14) / (max - min || 1);
    const pts = days.map((d, i) => x(i) + ',' + y(d.bal)).join(' ');
    const low = days.findIndex(d => d.bal < MINCASH);
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
      <line x1="0" x2="${W}" y1="${y(MINCASH)}" y2="${y(MINCASH)}" stroke="#b7791f" stroke-dasharray="4 4" stroke-width="1"/>
      <text x="${W - 4}" y="${y(MINCASH) - 4}" text-anchor="end" font-size="10" fill="#b7791f">неснижаемый остаток 5 млн</text>
      ${min < 0 ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#d64545" stroke-width="1"/>` : ''}
      <polyline points="${pts}" fill="none" stroke="#1f9e90" stroke-width="2.5" stroke-linejoin="round"/>
      ${days.map((d, i) => d.bal < MINCASH ? `<circle cx="${x(i)}" cy="${y(d.bal)}" r="3.5" fill="#d64545"/>` : '').join('')}
      <text x="${P}" y="${H - 2}" font-size="10" fill="#5b6470">${ds(days[0].d)}</text>
      <text x="${W - P}" y="${H - 2}" font-size="10" fill="#5b6470" text-anchor="end">${ds(days[days.length - 1].d)}</text>
    </svg>`;
  }

  function gap(days) {
    const bad = days.filter(d => d.bal < MINCASH);
    if (!bad.length) return `<div class="alert ok"><b>✅ Денег хватает на все платежи до ${ds(days[days.length - 1].d)}</b>Минимальный остаток ${mln(Math.min(...days.map(d => d.bal)))}.</div>`;
    const worst = bad.reduce((a, b) => b.bal < a.bal ? b : a);
    return `<div class="alert"><b>⚠️ ${dn(worst.d)}: ${worst.bal < 0 ? 'не хватит ' + mln(-worst.bal) : 'остаток всего ' + mln(worst.bal)}</b>
      Причина: оплата импорта 22 млн 11 декабря, а крупные клиенты платят позже. Что можно сделать:
      ${!moved ? '<button class="btn btn-teal" id="fixMove">Перенести оплату импорта на 19.12</button>' : ''}
      ${!reminded['Мега'] ? '<button class="btn btn-ghost" id="fixAr">Напомнить «Мега Строй» о долге 3,2 млн (просрочка 38 дней)</button>' : ''}</div>`;
  }
  function bindGap() {
    const a = document.getElementById('fixMove'); if (a) a.onclick = () => { moved = true; render(); toast('Платёж перенесён на 19.12, календарь пересчитан'); };
    const b = document.getElementById('fixAr'); if (b) b.onclick = () => { reminded['Мега'] = true; render(); toast('Напоминание отправлено, ожидаем оплату 11.12'); };
  }

  function home() {
    const days = flows(), end = days[days.length - 1];
    const overdue = AR.filter(a => a.due < TODAY);
    if (ROLE === 'com') {
      V.innerHTML = `
        <div class="tiles">
          <div class="tile hl"><div class="l">Продажи за ноябрь</div><div class="v">${mln(68.4e6)}</div><div class="n">план 72 млн · 95%</div></div>
          <div class="tile"><div class="l">Валовая маржа</div><div class="v">23,6%</div><div class="n">октябрь 24,1%</div></div>
          <div class="tile bad"><div class="l">Просрочено клиентами</div><div class="v">${mln(overdue.reduce((t, a) => t + a.sum, 0))}</div><div class="n">${overdue.length} клиента</div></div>
          <div class="tile"><div class="l">Должны всего</div><div class="v">${mln(AR.reduce((t, a) => t + a.sum, 0))}</div><div class="n">${AR.length} клиентов</div></div>
        </div>
        <div class="card"><h3>Продажи по менеджерам, ноябрь</h3>${[['Гульмира', 29.8, 30], ['Ержан', 22.1, 25], ['Айбек', 16.5, 17]].map(([n, f, p]) => `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${n}</span><b>${String(f).replace('.', ',')} из ${p} млн</b></div><div class="bar"><i style="width:${f / p * 100}%"></i></div></div>`).join('')}</div>`;
      return;
    }
    V.innerHTML = `
      <div class="tiles">
        <div class="tile hl"><div class="l">Деньги на счетах</div><div class="v">${mln(START)}</div><div class="n">3 банка, на 27.11</div></div>
        <div class="tile"><div class="l">Прибыль за ноябрь</div><div class="v">${mln(2.56e6)}</div><div class="n">октябрь 2,9 млн</div></div>
        <div class="tile"><div class="l">Выручка за ноябрь</div><div class="v">${mln(68.4e6)}</div><div class="n">план 72 млн · 95%</div></div>
        <div class="tile bad"><div class="l">Клиенты просрочили</div><div class="v">${mln(overdue.reduce((t, a) => t + a.sum, 0))}</div><div class="n">${overdue.length} клиента</div></div>
      </div>
      ${gap(days)}
      <div class="card"><h3>Остаток денег на 5 недель вперёд</h3>${chart(days)}<div class="muted">На ${ds(end.d)} ожидается ${mln(end.bal)}. Нажмите «Календарь», чтобы увидеть каждый платёж.</div></div>
      <div class="card"><h3>Счета</h3>${BANKS.map(b => `<div class="line"><span>${b[0]}</span><b>${tg(b[1])}</b></div>`).join('')}</div>
      <div class="card"><h3>Что подсказывает финансист</h3>
        <div class="line"><span>💡 Маржа снизилась с 24,1% до 23,6%: подорожала логистика. Это −340 тыс. прибыли в месяц.</span></div>
        <div class="line"><span>💡 «Мега Строй» не платит 38 дней. Отгрузки им лучше остановить до оплаты.</span></div>
        <div class="line"><span>💡 НДС за 4 квартал около ${mln(5.1e6)}: откладывайте по 1,7 млн в месяц, чтобы февраль не стал сюрпризом.</span></div>
      </div>
      <a class="btn btn-teal" href="./">Хочу такой учёт</a>`;
    bindGap();
  }

  function cal() {
    const days = flows().filter(x => x.ins.length || x.outs.length);
    V.innerHTML = `${ROLE === 'own' ? gap(flows()) : ''}
      <div class="note">Платёжный календарь собирается сам: поступления по срокам оплаты клиентов из 1С, платежи поставщикам, зарплата, налоги, кредит. Красным дни, где остаток ниже 5 млн.</div>
      ${days.map(x => `<div class="day"><span>${dn(x.d)}</span><span class="${x.bal < 0 ? 'neg' : x.bal < MINCASH ? 'warn' : 'pos'}">остаток ${mln(x.bal)}</span></div>
        ${x.ins.map(o => `<div class="op in"><span class="who">${o.n}<small>${o.c}</small></span><b class="pos">+${mln(o.s)}</b></div>`).join('')}
        ${x.outs.map(o => `<div class="op ${o.tax ? 'tax' : 'out'}"><span class="who">${o.n}<small>${o.c}${moved && o.movable ? ' · перенесено' : ''}</small></span><b>−${mln(o.s)}</b></div>`).join('')}`).join('')}`;
    bindGap();
  }

  function ar() {
    const age = a => Math.round((TODAY - a.due) / 864e5);
    const groups = [['Срок не наступил', a => age(a) <= 0], ['Просрочка до 30 дней', a => age(a) > 0 && age(a) <= 30], ['Просрочка больше 30 дней', a => age(a) > 30]];
    const list = ROLE === 'com' ? AR : AR;
    V.innerHTML = `
      <div class="tiles">${groups.slice(0, 2).map(([n, f], i) => { const s = list.filter(f).reduce((t, a) => t + a.sum, 0); return `<div class="tile ${i ? 'bad' : ''}"><div class="l">${n}</div><div class="v">${mln(s)}</div></div>`; }).join('')}</div>
      ${groups.map(([n, f]) => { const g = list.filter(f); return g.length ? `<div class="card"><h3>${n}</h3>${g.map(a => { const d = age(a); return `<div class="row2" data-a="${AR.indexOf(a)}"><div><div style="font-weight:600">${a.n}</div><div class="muted">менеджер ${a.mgr} · срок ${ds(a.due)}</div></div>
        <div style="text-align:right"><b>${mln(a.sum)}</b><div>${d > 0 ? `<span class="pill ${d > 30 ? 'p-no' : 'p-warn'}">${d} дн. просрочки</span>` : `<span class="pill p-wait">через ${-d} дн.</span>`}</div></div></div>`; }).join('')}</div>` : ''; }).join('')}`;
    V.querySelectorAll('[data-a]').forEach(e => e.onclick = () => {
      const a = AR[+e.dataset.a], d = age(a);
      open(`<button class="close" data-x>×</button><h3>${a.n}</h3><div class="muted">Менеджер ${a.mgr}</div>
        <div class="card" style="margin-top:12px"><div class="line"><span>Долг</span><b>${tg(a.sum)}</b></div><div class="line"><span>Срок оплаты</span><b>${ds(a.due)}</b></div><div class="line"><span>Статус</span><b class="${d > 0 ? 'neg' : ''}">${d > 0 ? d + ' дней просрочки' : 'срок через ' + (-d) + ' дн.'}</b></div><div class="line"><span>Ожидаем оплату</span><b>${ds(a.plan)}</b></div></div>
        <button class="btn btn-teal" id="r1">Напомнить клиенту (акт сверки и счёт)</button>
        <button class="btn btn-ghost" id="r2">Поручить менеджеру ${a.mgr}</button>`);
      document.getElementById('r1').onclick = () => { if (a.n.includes('Мега')) reminded['Мега'] = true; close(); render(); toast('Клиенту отправлены акт сверки и счёт (в демо не отправляется)'); };
      document.getElementById('r2').onclick = () => { close(); toast('Задача менеджеру создана (в демо не сохраняется)'); };
    });
  }

  function pl() {
    const R = [['Выручка (без НДС)', 68.4, 66.2, 72], ['Себестоимость товаров', -52.3, -50.3, -54.7], ['Валовая прибыль', 16.1, 15.9, 17.3, 1],
      ['ФОТ с налогами: продажи', -3.6, -3.5, -3.6], ['ФОТ с налогами: склад и доставка', -2.4, -2.3, -2.4], ['ФОТ с налогами: офис', -1.9, -1.9, -1.9],
      ['Аренда склада и офиса', -1.8, -1.8, -1.8], ['Логистика', -1.6, -1.2, -1.3], ['Маркетинг', -0.4, -0.5, -0.5], ['Банк и прочее', -0.5, -0.4, -0.5], ['Проценты по кредиту', -0.7, -0.7, -0.7],
      ['Прибыль до налога', 3.2, 3.6, 4.6, 1], ['КПН 20% (оценка)', -0.64, -0.72, -0.92], ['Чистая прибыль', 2.56, 2.88, 3.68, 2]];
    const DIR = [['Продукты питания', 31.2, 19.5], ['Бытовая химия', 18.6, 27.4], ['Медтовары и аптеки', 12.9, 31.8], ['Стройматериалы', 5.7, 14.1]];
    V.innerHTML = `${ROLE === 'own' ? `<div class="card"><h3>Прибыль и убытки, ноябрь, млн ₸</h3>
        <div class="line" style="font-size:12px;color:var(--hint)"><span>Статья</span><span style="display:flex;gap:14px"><span>ноябрь</span><span>октябрь</span><span>план</span></span></div>
        ${R.map(([n, f, o, p, t]) => `<div class="line ${t === 2 ? 'tot' : ''}" style="${t ? 'font-weight:700' : ''}"><span>${n}</span><span style="display:flex;gap:14px;white-space:nowrap"><b class="${f < 0 ? '' : 'pos'}">${f.toFixed(1).replace('.', ',')}</b><span class="muted">${o.toFixed(1).replace('.', ',')}</span><span class="muted">${p.toFixed(1).replace('.', ',')}</span></span></div>`).join('')}
        <div class="muted" style="margin-top:6px">Логистика выше плана на 0,3 млн, выручка ниже плана на 3,6 млн.</div></div>` : ''}
      <div class="card"><h3>Маржа по направлениям, ноябрь</h3>${DIR.map(([n, r, m]) => `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${n}</span><b>${String(r).replace('.', ',')} млн · ${String(m).replace('.', ',')}%</b></div><div class="bar"><i style="width:${m / 35 * 100}%;background:${m < 16 ? '#d64545' : '#1f9e90'}"></i></div></div>`).join('')}
        <div class="muted">Медтовары дают 19% выручки, но 26% валовой прибыли. Стройматериалы с маржой 14% почти не окупают склад.</div></div>`;
  }

  function tax() {
    const T = [
      [D(12, 25), 'ИПН, ОПВ, ОПВР, СО, ВОСМС, ООСМС, СН за ноябрь', 3400000, 'оплата'],
      [D(12, 25), 'КПН: авансовый платёж за декабрь', 900000, 'оплата'],
      [D(1, 25), 'Зарплатные налоги за декабрь', 3500000, 'оплата'],
      [D(2, 15), 'Декларация по НДС (ф. 300) за 4 квартал', 0, 'сдача'],
      [D(2, 25), 'НДС за 4 квартал', 5100000, 'оплата'],
      [D(3, 31), 'Декларация по КПН (ф. 100) за 2026 год', 0, 'сдача'],
    ];
    V.innerHTML = `
      <div class="note">Налоговый календарь: сколько и когда уйдёт, чтобы деньги были заранее. Суммы считаются по данным 1С. Сроки в примере, для вашей компании сверим с НК РК.</div>
      <div class="card"><h3>НДС за 4 квартал (копится)</h3>
        <div class="line"><span>Начислено с продаж (окт-ноя)</span><b>${tg(16200000)}</b></div>
        <div class="line"><span>В зачёт по покупкам и импорту</span><b>−${tg(12800000)}</b></div>
        <div class="line"><span>Прогноз за декабрь</span><b>+${tg(1700000)}</b></div>
        <div class="line tot"><span>К оплате 25 февраля (оценка)</span><b class="warn">${tg(5100000)}</b></div>
        <div class="muted" style="margin-top:6px">Отложено пока 1,7 млн из 5,1 млн.</div><div class="bar"><i style="width:33%"></i></div></div>
      <div class="card"><h3>Ближайшие налоги</h3>${T.map(([d, n, s, k]) => `<div class="line"><span>${ds(d)}${d.getFullYear() > 2026 ? '.27' : ''} · ${n}</span><b>${s ? tg(s) : '<span class="pill p-wait">' + k + '</span>'}</b></div>`).join('')}</div>`;
  }

  function open(h) { document.getElementById('sheetBox').innerHTML = h; document.getElementById('sheet').classList.add('open'); document.querySelectorAll('[data-x]').forEach(b => b.onclick = close); }
  function close() { document.getElementById('sheet').classList.remove('open'); }
  document.getElementById('sheet').onclick = e => { if (e.target.id === 'sheet') close(); };
  const RN = { home, cal, ar, pl, tax };
  function render() { head(); RN[tab](); }
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
