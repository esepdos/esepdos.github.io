  // Подсказка под заголовком экрана: что здесь видно и зачем
  const HINTS = [

<script>
// ====== Вставьте сюда адрес веб-приложения Google Apps Script (заканчивается на /exec) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbw6juK8GHilzHdv2zN4VE6syBlK4Ad8gndfmeKLixjNZKyNXYgBErm-WC1HYq_ELZE4kQ/exec';
// ==========================================================================================

const tg = window.Telegram && window.Telegram.WebApp;
const $app = document.getElementById('app');
const $nav = document.getElementById('nav');
let ME = null, TAB = 'home', DOCFILTER = 'На проверке', MONTH = monthNow(), PENDING_FILES = [], CUR = null;
let CLIENT = new URLSearchParams(location.search).get('client') || localStorage.getItem('client') || '';

const STATUS_CLASS = { 'На проверке': 'b-wait', 'Утверждён': 'b-ok', 'Отклонён': 'b-no', 'Ошибка распознавания': 'b-err' };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function monthNow() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { const v = Math.round((Number(n) || 0) * 100) / 100; const [i, f] = Math.abs(v).toFixed(2).split('.'); return (v < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (f === '00' ? '' : ',' + f) + ' ₸'; }
function badge(s) { return `<span class="badge ${STATUS_CLASS[s] || 'b-wait'}">${esc(s)}</span>`; }
function checkClass(c) { return /^Сумма сходится/.test(c || '') && !/не найдены/.test(c || '') ? 'check-ok' : 'check-bad'; }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function loading(text) { $app.innerHTML = `<div class="center"><div class="spin"></div>${esc(text || 'Загрузка…')}</div>`; }

async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action, initData: tg ? tg.initData : '', client: CLIENT }, data || {})),
  });
  const j = await res.json();
  if (j.error === 'no_access') { showNoAccess(j); throw new Error('no_access'); }
  if (j.error) throw new Error(j.error);
  return j;
}

// ====== Запоминание на телефоне: сразу показываем то, что видели в прошлый раз, свежее подгружаем ======
const UID = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || '';
const CK = 'fa1:';
function ckey(action, data) { return CK + UID + ':' + CLIENT + ':' + action + ':' + JSON.stringify(data || {}); }
function cget(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function cput(k, v) {
  const s = JSON.stringify(v);
  for (let t = 0; t < 2; t++) {
    try {
      localStorage.setItem(k, s);
      const idx = (cget(CK + 'idx') || []).filter(x => x !== k); idx.push(k);
      while (idx.length > 40) localStorage.removeItem(idx.shift());   // храним не больше 40 страниц
      localStorage.setItem(CK + 'idx', JSON.stringify(idx));
      return;
    } catch (e) { Object.keys(localStorage).filter(x => x.indexOf(CK) === 0).forEach(x => localStorage.removeItem(x)); }
  }
}
let BUSY = 0;
function refreshing(on) {
  BUSY = Math.max(0, BUSY + (on ? 1 : -1));
  let el = document.getElementById('refresh');
  if (BUSY && !el) { el = document.createElement('div'); el.id = 'refresh'; el.className = 'refresh'; el.textContent = 'обновляю…'; document.body.appendChild(el); }
  if (!BUSY && el) el.remove();
}
// o.draw(data) рисует; o.alive() = пользователь ещё на этой странице; o.wait() = крутилка, если прошлых данных нет; o.fail(e)
async function load(action, data, o) {
  const k = ckey(action, data), old = cget(k);
  if (old) { if (o.alive()) o.draw(old); refreshing(true); }
  else if (o.wait) o.wait();
  try {
    const fresh = await api(action, data);
    cput(k, fresh);
    if (!o.alive()) return;
    if (!old || JSON.stringify(old) !== JSON.stringify(fresh)) { const y = window.scrollY; o.draw(fresh); if (old) window.scrollTo(0, y); }
  } catch (e) {
    if (e.message === 'no_access' || !o.alive()) return;
    if (old) toast('Не удалось обновить: ' + e.message); else o.fail(e);
  } finally { if (old) refreshing(false); }
}
function failCard(e) { $app.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
// Утверждённые и отклонённые в этом сеансе: на экране меняем сразу, не дожидаясь Google
const OVR = {};
function withOvr(docs, filter) {
  return docs.map(d => OVR[d.id] ? Object.assign({}, d, { status: OVR[d.id] }) : d)
    .filter(d => !filter || filter === 'Все' || d.status === filter);
}

function showNoAccess(j) {
  $nav.hidden = true;
  $app.innerHTML = `<div class="card center"><h1>Нет доступа</h1><p>Передайте этот номер бухгалтеру, вас добавят в список сотрудников.</p><p class="big">${esc(j.telegramId)}</p></div>`;
}

// «Документы / Закупка» одной кнопкой внизу (у кого есть «Аналитика»)
function docBuyChips(on) {
  return ME.user.personal ? `<div class="chips seg">${[['docs', 'Документы'], ['buy', 'Закупка']].map(([k, t]) => `<button class="chip ${k === on ? 'on' : ''}" data-dbuy="${k}">${t}</button>`).join('')}</div>` : '';
}
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-dbuy]'); if (b && b.dataset.dbuy !== TAB) go(b.dataset.dbuy);
  const a = e.target.closest('[data-anv]'); if (a) { ANV = a.dataset.anv; renderAn(); window.scrollTo(0, 0); }
});

// ====== Навигация ======
$nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
function go(tab) {
  TAB = tab; CUR = null;
  const navTab = tab === 'upload' || tab === 'manual' || (tab === 'buy' && $nav.querySelector('[data-tab="buy"]').hidden) ? 'docs' : tab;
  [...$nav.children].forEach(b => b.classList.toggle('on', b.dataset.tab === navTab));
  if (tg) tg.BackButton.hide();
  if (tab === 'home') renderHome();
  if (tab === 'upload') { renderUpload(); if (tg) tg.BackButton.show(); }
  if (tab === 'manual') { renderManual(); if (tg) tg.BackButton.show(); }
  if (tab === 'docs') renderDocs();
  if (tab === 'reports') { REP = null; DAYDATA = null; renderReports(); }   // прошлые цифры сразу, свежие следом
  if (tab === 'buy') renderBuy();
  if (tab === 'personal') renderPersonal();
  if (tab === 'an') renderAn();
  window.scrollTo(0, 0);
}

// ====== Отчёты: ОПиУ, план-факт, ЗП собственницы, ДДС, рассрочки ======
let REP = null, PFROM = '', PTO = '';
const MSHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function mLabel(k) { const [y, m] = k.split('-'); return MSHORT[Number(m) - 1] + ' ' + y; }
function mDiff(a, b) { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); }
function tg0(n) { return money(Math.round(n || 0)); }
function nb(n) { return money(Math.round(n || 0)).replace(' ₸', ''); }
function pct(a, b) { return b ? Math.round((a - b) / Math.abs(b) * 100) : null; }

async function renderReports() {
  if (REP) return drawRepView();
  return load('reports', {}, {
    wait: () => loading('Загружаю отчёты…'),
    alive: () => TAB === 'reports',
    fail: failCard,
    draw: data => {
      REP = data;
      if (REP.months.length && !(REP.months.includes(PFROM) && REP.months.includes(PTO))) PFROM = PTO = REP.factTo || REP.months[REP.months.length - 1];
      drawRepView();
    },
  });
}
function drawRepView() {
  if (!REP.months.length) { $app.innerHTML = '<div class="card muted">Отчётов пока нет. Их добавляет бухгалтер после обновления модели.</div>'; return; }
  if (!REPVIEW) REPVIEW = ME.user.admin ? 'fin' : 'main';
  if (REPVIEW === 'main') drawMain();
  else if (REPVIEW === 'staff') drawStaff();
  else if (REPVIEW === 'days') renderDays();
  else if (REPVIEW === 'years') drawYears();
  else drawReports();
}

function sumRange(arr, idx) { let s = 0, any = false; idx.forEach(i => { if (arr[i] !== null && arr[i] !== undefined) { s += arr[i]; any = true; } }); return any ? s : null; }

// ---------- Свернуть / раскрыть (запоминается на этом телефоне, у каждого своё) ----------
let RMODE = null, TGL = new Set(), BLK = new Set();
function openKey() { return CK + UID + ':open'; }
function loadOpen() {
  if (RMODE) return;
  let s = {};
  try { s = JSON.parse(localStorage.getItem(openKey()) || '{}'); } catch (e) {}
  RMODE = s.mode || (ME.user.admin ? 'full' : 'short');   // Арайлым подробно, остальные кратко
  TGL = new Set(s.tgl || []); BLK = new Set(s.blk || []);
}
function saveOpen() { try { localStorage.setItem(openKey(), JSON.stringify({ mode: RMODE, tgl: [...TGL], blk: [...BLK] })); } catch (e) {} }
function isOpen(k) { return (RMODE === 'full') !== TGL.has(k); }
function arrow(open) { return `<span class="arr">${open ? '▾' : '▸'}</span>`; }
function bindToggles(redraw) {
  const again = () => { const y = window.scrollY; redraw(); window.scrollTo(0, y); };
  $app.querySelectorAll('[data-tg]').forEach(el => el.onclick = () => { const k = el.dataset.tg; TGL.has(k) ? TGL.delete(k) : TGL.add(k); saveOpen(); again(); });
  $app.querySelectorAll('[data-blk]').forEach(el => el.onclick = () => { const k = el.dataset.blk; BLK.has(k) ? BLK.delete(k) : BLK.add(k); saveOpen(); again(); });
  $app.querySelectorAll('[data-mode]').forEach(el => el.onclick = () => { RMODE = el.dataset.mode; TGL.clear(); saveOpen(); again(); });
}
function block(key, title, summary, body) {
  const open = !BLK.has(key);
  return `<h2 class="tg blk" data-blk="${key}"><span>${arrow(open)}${title}</span>${open ? '' : `<span class="bsum">${summary}</span>`}</h2>${open ? body : ''}`;
}

// ---------- Расчёт ОПиУ за выбранные месяцы ----------
function plCalc(R, idx) {
  const pl = R.lines.filter(l => l.sec === 'ОПиУ');
  const factIdx = idx.filter(i => pl.some(l => l.fact[i] !== null));
  const hasFact = factIdx.length > 0, cmpIdx = hasFact ? factIdx : idx;
  const val = (l, kind) => sumRange(kind === 'f' ? l.fact : l.plan, kind === 'f' ? factIdx : cmpIdx) || 0;
  const tot = (kind, grp) => pl.filter(l => l.grp === grp).reduce((s, l) => s + val(l, kind), 0);
  const own = R.lines.filter(l => l.sec === 'Собственница');
  const calc = kind => {
    const rev = tot(kind, 'Выручка'), vr = tot(kind, 'Переменные'), fx = tot(kind, 'Постоянные'), bt = tot(kind, 'Амортизация и налог');
    const get = g => own.filter(l => l.grp === g).reduce((s, l) => s + val(l, kind), 0);
    const net = rev - vr - fx - bt, zp = get('ЗП'), adj = get('Поправки');
    return { rev, vr, fx, bt, ebitda: rev - vr - fx, net, zp, adj, norm: net - zp - adj, ownServ: get('Услуги') };
  };
  const F = calc('f'), P = calc('p');
  // что вышло за план
  const alerts = [];
  if (hasFact) pl.forEach(l => {
    const f = val(l, 'f'), p = val(l, 'p'), d = f - p;
    if (l.grp === 'Выручка') { if (p > 0 && d < -Math.max(20000, p * 0.05)) alerts.push({ t: l.name + ': ниже плана', d }); }
    else if (l.name === 'Расходники и материалы') return;   // в ОПиУ по норме от услуг, следим за закупками ниже
    else if (l.grp !== 'Амортизация и налог' && d > Math.max(10000, p * 0.1)) alerts.push({ t: l.name, d });
  });
  // Закупки расходников (ДДС, по оплате) за 3 последних месяца с фактом против нормы в ОПиУ: больше на 20% = закупили впрок или тратят больше нормы
  const lastF = factIdx[factIdx.length - 1];
  if (lastF !== undefined) {
    const k3 = [lastF - 2, lastF - 1, lastF].filter(i => i >= 0 && pl.some(l => l.fact[i] !== null));
    const buy = R.lines.find(l => l.sec === 'ДДС' && l.name === 'Расходники и материалы'), norm = pl.find(l => l.name === 'Расходники и материалы');
    if (buy && norm && k3.length) {
      const b = sumRange(buy.fact, k3) || 0, n = sumRange(norm.fact, k3) || 0;
      if (n && b > n * 1.2) alerts.push({ t: 'Закупки расходников за 3 мес. больше нормы', d: b - n });
    }
  }
  // собственник сделала меньше услуг, чем по плану (её клиентов взяли наёмные или клиентов меньше)
  const ownL = own.find(l => l.grp === 'Услуги');
  if (hasFact && ownL) {
    const f = sumRange(ownL.fact, factIdx) || 0, p = sumRange(ownL.plan, factIdx) || 0;
    if (p && f < p - Math.max(50000, p * 0.05)) alerts.push({ t: 'Услуги собственника: ниже плана', d: f - p });
  }
  alerts.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  return { pl, factIdx, hasFact, val, F, P, alerts };
}

// ЗП мастеров по именам: выплачено (журнал) и положено (их услуги × ставка). Разница со строкой ОПиУ = «прочее».
function zpPeople(R, line, X) {
  if (!/мастер|мастер/i.test(line.name)) return null;
  const rules = R.staff || [], sl = R.lines.filter(l => l.sec === 'Сотрудники');
  // выплаты по имени: из раздела «Сотрудники», а если его нет, из ДДС («ЗП мастера: Старший мастер»)
  const ddsPaid = {};
  R.lines.filter(l => l.sec === 'ДДС' && /^ЗП (мастера|мастера):/i.test(l.name)).forEach(l => { ddsPaid[l.name.split(':')[1].trim()] = l; });
  const people = [...new Set(sl.map(l => l.grp).concat(Object.keys(ddsPaid)))].filter(n => {
    const r = rules.filter(x => x.name === n).slice(-1)[0];
    return r ? !/собствен|админ/i.test(r.role) : !!ddsPaid[n];
  });
  const rows = people.map(n => {
    const paid = sl.find(l => l.grp === n && l.name === 'Выплачено') || ddsPaid[n], serv = sl.find(l => l.grp === n && l.name === 'Услуги');
    const f = paid ? (sumRange(paid.fact, X.factIdx) || 0) : 0;
    let p = 0;
    X.factIdx.forEach(i => { const r = ruleFor(rules, n, R.months[i]); if (r && serv) p += (serv.fact[i] || 0) * r.pct / 100; });
    return { n, f: Math.round(f), p: Math.round(p) };
  }).filter(x => x.f || x.p).sort((a, b) => b.f - a.f);
  if (!rows.length) return null;
  const hasPlan = rows.some(x => x.p);
  if (!hasPlan) rows.forEach(x => { x.p = null; });   // услуг по именам нет: план по людям не показываем
  const rf = X.val(line, 'f') - rows.reduce((s, x) => s + x.f, 0), rp = hasPlan ? X.val(line, 'p') - rows.reduce((s, x) => s + x.p, 0) : 0;
  if (Math.abs(rf) >= 1 || Math.abs(rp) >= 1) rows.push({ n: 'Прочее (вне журнала, округления)', f: rf, p: rp });
  return rows;
}

function loansCalc(R) {
  const now = R.today || monthNow();
  const loans = R.loans.map(x => {
    const paid = Math.max(0, Math.min(x.count, x.first ? mDiff(x.first, now) + 1 : 0));
    const left = Math.max(0, x.sum - paid * x.pay);
    const lastM = x.first ? (() => { let k = x.first; for (let i = 1; i < x.count; i++) k = shiftMonth(k, 1); return k; })() : '';
    return Object.assign({ paid, left, lastM }, x);
  });
  return { loans, left: loans.reduce((s, x) => s + x.left, 0), pay: loans.filter(x => x.left > 0).reduce((s, x) => s + x.pay, 0) };
}

function drawReports() {
  loadOpen();
  const R = REP, ms = R.months;
  const idx = ms.map((m, i) => i).filter(i => ms[i] >= PFROM && ms[i] <= PTO);
  const X = plCalc(R, idx), { pl, factIdx, hasFact, val, F, P, alerts } = X;
  const opts = ms.map(m => `<option value="${m}">${mLabel(m)}${m > (R.factTo || '') ? ' (план)' : ''}</option>`).join('');
  const lastQ = ms.filter(m => m <= R.factTo).slice(-3);
  const yearOf = m => m.slice(0, 4);
  const dev = (f, p, isRev) => {
    if (!hasFact || !p) return '';
    const d = f - p, k = pct(f, p);
    const bad = isRev ? d < 0 : d > 0;
    if (Math.abs(d) < 1) return '<span class="muted">0</span>';
    return `<span class="${bad ? 'over' : 'under'}">${d > 0 ? '+' : ''}${tg0(d)}${k !== null ? ' (' + (k > 0 ? '+' : '') + k + '%)' : ''}</span>`;
  };
  const devS = (f, p, isRev) => {
    if (!hasFact || !p) return '';
    const d = f - p, k = pct(f, p);
    if (Math.abs(d) < 1) return '';
    const bad = isRev ? d < 0 : d > 0;
    return `<span class="${bad ? 'over' : 'under'}">${d > 0 ? '+' : ''}${nb(d)}${k !== null ? `<div class="dv">${k > 0 ? '+' : ''}${k}%</div>` : ''}</span>`;
  };
  // строка таблицы; tg = ключ, если строку можно раскрыть
  const row = (name, f, p, cls, isRev, tg, note) => `<tr class="${cls || ''}${tg ? ' tg' : ''}" ${tg ? `data-tg="${tg}"` : ''}><td>${tg ? arrow(isOpen(tg)) : ''}${esc(name)}${note ? `<div class="dv muted" style="font-weight:400">${esc(note)}</div>` : ''}</td><td class="n">${hasFact ? nb(f) : ''}</td><td class="n muted">${p === null ? '' : nb(p)}</td><td class="n">${p === null ? '' : devS(f, p, isRev)}</td></tr>`;
  const subs = grp => pl.filter(l => l.grp === grp).sort((a, b) => a.order - b.order).filter(l => Math.abs(val(l, 'f')) + Math.abs(val(l, 'p')) > 0);
  const grpBlock = (grp, title, f, p, isRev) => {
    const k = 'g:' + grp;
    if (!isOpen(k)) return row(title, f, p, 'g', isRev, k);
    return row(title, f, p, 'g', isRev, k) + subs(grp).map(l => {
      const zp = zpPeople(R, l, X);
      if (!zp) return row(l.name, val(l, 'f'), val(l, 'p'), 'sub', isRev);
      const kz = 'z:' + l.name;
      return row(l.name, val(l, 'f'), val(l, 'p'), 'sub', isRev, kz) + (isOpen(kz) ? zp.map(z => row(z.n, z.f, z.p, 'sub2', isRev)).join('') : '');
    }).join('');
  };
  // ДДС
  const dl = R.lines.filter(l => l.sec === 'ДДС');
  // только закрытые месяцы: строки текущего месяца по выпискам (Kaspi Pay, Halyk) живут в карточке «месяц по сегодня»
  const dIdx = idx.filter(i => R.months[i] <= R.factTo && dl.some(l => l.fact[i] !== null && l.grp !== 'Остаток на начало' && l.grp !== 'Остаток на конец'));
  const dv = l => sumRange(l.fact, dIdx) || 0;
  const dGrp = g => dl.filter(l => l.grp === g && Math.abs(dv(l)) > 0).sort((a, b) => a.order - b.order);
  const dSum = g => dGrp(g).reduce((s, l) => s + dv(l), 0);
  const startL = dl.find(l => l.grp === 'Остаток на начало'), endL = dl.find(l => l.grp === 'Остаток на конец');
  const endSum = endL && dIdx.length ? endL.fact[dIdx[dIdx.length - 1]] : 0;

    const items = dGrp(grp);

    let body = items.map(l => line(l)).join('');
    if (grp === 'Поступления') {
      // услуги одной строкой с итогом (раскрывается по видам), товары и прочее отдельно
      const notServ = l => /товар|прочие поступления|по выписке|терминал/i.test(l.name);
      const serv = items.filter(l => !notServ(l)), rest = items.filter(notServ), ks = 'd:serv', os = isOpen(ks);
      body = (serv.length ? `<tr class="sub tg" data-tg="${ks}"><td>${arrow(os)}<b>Услуги</b></td><td class="n"><b>${tg0(serv.reduce((a, l) => a + dv(l), 0))}</b></td></tr>`
        + (os ? serv.map(l => line(l, true)).join('') : '') : '') + rest.map(l => line(l)).join('');
    }
    return `<tr class="g tg" data-tg="${k}"><td>${arrow(open)}${title}</td><td class="n">${tg0(dSum(grp))}</td></tr>` + (open ? body : '');
  };
  const ddsHtml = dIdx.length ? `
    <table class="rep"><tbody>
      <tr class="g"><td>Остаток на начало</td><td class="n">${tg0(startL ? startL.fact[dIdx[0]] : 0)}</td></tr>
      ${dBlock('Поступления', 'Принятые оплаты (поступления)')}
      ${dBlock('Выплаты', 'Выплаты')}
      ${dBlock('Инвестиции', 'Оборудование')}
      ${dBlock('Финансы', 'Кредиты и собственница')}

  const L = loansCalc(R);
  const period = PFROM === PTO ? mLabel(PFROM) : mLabel(PFROM) + ' - ' + mLabel(PTO);

  $app.innerHTML = `
    <h1>Отчёты · ${esc(ME.client.name)}</h1>

      <button class="chip" data-q="last">Последний месяц</button>
      <button class="chip" data-q="q">3 месяца</button>
      ${[...new Set(ms.map(yearOf))].map(y => `<button class="chip" data-q="y${y}">${y} год</button>`).join('')}

    ${!hasFact ? `<div class="notes">За ${esc(period)} факта ещё нет, показан только план. Факт есть по ${esc(mLabel(R.factTo))}.</div>` : (idx.length > factIdx.length ? `<div class="notes">Факт есть по ${esc(mLabel(R.factTo))}. План сравнивается только за месяцы с фактом.</div>` : '')}

    <div class="grid2">
      <div class="card"><div class="muted">Выручка</div><div class="big" style="font-size:20px">${hasFact ? tg0(F.rev) : 'нет факта'}</div><div class="muted">план ${tg0(P.rev)} ${dev(F.rev, P.rev, true)}</div></div>
      <div class="card"><div class="muted">Чистая прибыль</div><div class="big" style="font-size:20px">${hasFact ? tg0(F.net) : 'нет факта'}</div><div class="muted">план ${tg0(P.net)} ${dev(F.net, P.net, true)}</div><div class="muted" style="font-size:11px">по записанным расходам, возможна погрешность</div></div>
    </div>
    <div class="card">
      <div class="kv"><span>ЗП собственника (40% его услуг)</span><b>${tg0(hasFact ? F.zp : P.zp)}</b></div>
      <div class="kv"><span>Прибыль бизнеса после ЗП собственника</span><b class="${(hasFact ? F.norm : P.norm) < 0 ? 'over' : ''}">${tg0(hasFact ? F.norm : P.norm)}</b></div>
    </div>

    <div class="chips seg mode">
      <button class="chip ${RMODE === 'short' ? 'on' : ''}" data-mode="short">Кратко</button>
      <button class="chip ${RMODE === 'full' ? 'on' : ''}" data-mode="full">Подробно</button>
      <span class="muted" style="align-self:center;font-size:12px">▸ нажмите строку, чтобы раскрыть</span>
    </div>

    ${hasFact && F.rev > 0 ? block('where', 'Куда ушла выручка', 'прибыль ' + Math.round(F.net / F.rev * 100) + '%', (() => {
      const parts = [['Переменные', F.vr, '#ff7a6b'], ['Постоянные', F.fx, '#f0b429'], ['Налог и износ', F.bt, '#9aa0a8'], [F.net >= 0 ? 'Прибыль' : 'Убыток', Math.abs(F.net), F.net >= 0 ? 'var(--accent)' : 'var(--bad)']].filter(p => p[1] > 0);
      return `<div class="card"><div class="sbar">${parts.map(p => `<i style="flex:${p[1]};background:${p[2]}">${p[1] / F.rev > .09 ? Math.round(p[1] / F.rev * 100) + '%' : ''}</i>`).join('')}</div>
        ${parts.map(p => `<div class="kv"><span><span class="dot" style="background:${p[2]}"></span>${p[0]}</span><b>${tg0(p[1])}</b></div>`).join('')}</div>`;
    })()) : ''}

    ${hasFact ? (() => {
      const ex = pl.filter(l => l.grp !== 'Выручка' && l.grp !== 'Амортизация и налог').map(l => ({ n: l.name, f: val(l, 'f'), p: val(l, 'p') })).filter(x => x.p > 0 && x.f > 0).sort((x, y) => y.f - x.f).slice(0, 6);
      if (!ex.length) return '';
      return block('pf', 'План-факт расходов', 'черта = план', `<div class="card">${ex.map(x => {

    ${block('opiu', `Прибыли и убытки (ОПиУ) · ${esc(period)}`, 'прибыль ' + tg0(hasFact ? F.net : P.net), `

      ${grpBlock('Постоянные', 'Постоянные расходы', F.fx, P.fx)}

    <div class="muted" style="padding:0 6px">Факт по ${esc(mLabel(R.factTo))}. План 2026: средний месяц 2026 года с сезонностью; 2027: бюджет из модели.</div>`;

  bindViews();
  bindToggles(drawReports);
  const pf = document.getElementById('pf'), pt = document.getElementById('pt');

  $app.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const q = b.dataset.q;

    else { const y = q.slice(1); const inY = ms.filter(m => yearOf(m) === y); PFROM = inY[0]; PTO = inY[inY.length - 1]; }

  });
}

// ---------- Текущий месяц по сегодня: услуги Altegio, приход по выпискам, сколько кому положено ----------
// Положено: % от своих услуг (Altegio, мастер ищется по первому слову имени) + оклад и таргет за прошедшие рабочие дни
// + бонус % от услуг центра. Условия с листа «Сотрудники».
function payList(days, rules, m, now) {
  const serv = days.reduce((s, x) => s + x.sum, 0), byFirst = {};
  days.forEach(x => Object.entries(x.staff || {}).forEach(([n, v]) => { const k = n.trim().split(/\s+/)[0].toLowerCase(); byFirst[k] = (byFirst[k] || 0) + v.sum; }));
  return [...new Set(rules.map(r => r.name))].map(n => {
    const r = ruleFor(rules, n, m);
    if (!r || /уволен/i.test(r.note || '')) return null;
    const own = (byFirst[n.trim().split(/\s+/)[0].toLowerCase()] || 0);
    const wAll = workdays(m, r.off), o = offDays(r.off);
    let wPast = 0; for (let k = 1; k <= now.getDate(); k++) if (!o.includes(new Date(now.getFullYear(), now.getMonth(), k).getDay())) wPast++;
    const part = wAll ? wPast / wAll : 1;
    const p = own * r.pct / 100 + (r.salary + r.target) * part + serv * r.centerPct / 100;
    return p >= 1 ? { n, own, p, r } : null;
  }).filter(Boolean).sort((x, y) => y.p - x.p);
}
function payHtml(ppl) {
  return ppl.map(x => `<div class="kv"><span>${esc(x.n)}<span class="muted">${x.own ? ' · услуги ' + tg0(x.own) + ' × ' + x.r.pct + '%' : ''}${x.r.salary || x.r.target ? ' · ' + [x.r.salary ? 'оклад' : '', x.r.target ? 'таргет' : ''].filter(Boolean).join(' и ') + ' за прошедшие рабочие дни' : ''}${x.r.centerPct ? ' · бонус ' + x.r.centerPct + '%' : ''}</span></span><b>${tg0(x.p)}</b></div>`).join('');
}
function curMonthCard() { return `<div class="card" id="cm"><div class="row"><span class="muted">${MONTHS[new Date().getMonth()]} по сегодня (Altegio)</span><b>…</b></div></div>`; }
async function fillCurMonth() {

      ${d.goods && d.goods.sum !== null ? `<div class="kv" style="margin-top:6px"><span>Услуги</span><b>${tg0(serv)}</b></div><div class="kv"><span>Товары</span><b>${tg0(d.goods.sum)}</b></div><div class="kv"><span><b>Итого выручка</b></span><b class="gold">${tg0(serv + d.goods.sum)}</b></div>` : ''}
      ${inc.length ? `<div style="margin-top:8px"><div class="muted">Пришло на счета (по выпискам)</div>${inc.map(([n, v]) => `<div class="kv"><span>${esc(n)}</span><b>${tg0(v)}</b></div>`).join('')}<div class="muted">Наличные по журналу администратора ещё не внесены.</div></div>` : ''}
      ${ppl.length ? `<div style="margin-top:8px"><div class="muted">Положено на сегодня</div>${payHtml(ppl)}<div class="muted">Выплаты за месяц ещё не внесены: сравним после журнала администратора.</div></div>` : ''}`;

async function fillWeek() {

// ---------- Условия оплаты ----------
const WD = { 'вс': 0, 'пн': 1, 'вт': 2, 'ср': 3, 'чт': 4, 'пт': 5, 'сб': 6 };
function offDays(s) { return String(s || '').toLowerCase().split(/[,\s]+/).map(x => WD[x.slice(0, 2)]).filter(x => x !== undefined); }
function ruleFor(rules, name, month) {
  return rules.filter(r => r.name === name && r.from <= month).sort((a, b) => a.from < b.from ? 1 : -1)[0] || null;
}
function workdays(month, off) {
  const [y, m] = month.split('-').map(Number), n = new Date(y, m, 0).getDate(), o = offDays(off);
  let c = 0; for (let d = 1; d <= n; d++) if (!o.includes(new Date(y, m - 1, d).getDay())) c++;
  return c;
}
function tabelShare(tabel, name, month, off) {
  const t = (tabel || []).find(x => x.name === name && x.month === month);
  if (!t) return 1;
  const w = workdays(month, off);
  return w ? Math.min(1, t.days / w) : 1;
}

// ---------- Сотрудники: положено и выплачено по месяцам ----------
function drawStaff() {
  const R = REP, ms = R.months, rules = R.staff || [];
  const idx = ms.map((m, i) => i).filter(i => ms[i] >= PFROM && ms[i] <= PTO && ms[i] <= R.factTo);
  const opts = ms.filter(m => m <= R.factTo).map(m => `<option value="${m}">${mLabel(m)}</option>`).join('');
  const center = R.lines.find(l => l.sec === 'ОПиУ' && l.name === 'Услуги');
  const sl = R.lines.filter(l => l.sec === 'Сотрудники');
  const people = [...new Set(sl.map(l => l.grp))];
  const cards = people.map(name => {
    const serv = sl.find(l => l.grp === name && l.name === 'Услуги'), paid = sl.find(l => l.grp === name && l.name === 'Выплачено');
    let s = 0, acc = 0, sal = 0, tgt = 0, bon = 0, pd = 0, anyPaid = false, role = '', pct = 0, cpct = 0;
    idx.forEach(i => {
      const m = ms[i], r = ruleFor(rules, name, m);
      if (!r) return;
      role = r.role; pct = r.pct; cpct = r.centerPct;
      const sv = serv ? (serv.fact[i] || 0) : 0, share = tabelShare(R.tabel, name, m, r.off);
      s += sv;
      const own = sv * r.pct / 100, a = r.salary * share, b = r.target * share, tb = (R.tabel || []).find(x => x.name === name && x.month === m), bShare = tb && /бонус полност/i.test(tb.note || '') ? 1 : share,
        c = (center && center.fact[i] || 0) * r.centerPct / 100 * bShare;
      acc += own + a + b + c; sal += a; tgt += b; bon += c;
      if (paid && paid.fact[i] !== null) { pd += paid.fact[i]; anyPaid = true; }
    });
    if (!role) return '';
    const last = rules.filter(x => x.name === name).slice(-1)[0];
    const diff = acc - pd;
    // «без долга» или «уволен(а)» в примечании на листе «Сотрудники»: долг не показываем
    const fired = last && /уволен/i.test(last.note || '');
    const noDebt = last && (fired || /без долга/i.test(last.note || ''));
    return `<div class="card">
      <div class="row"><b>${esc(name)}</b><span class="muted">${esc(role)}${last && last.off ? ' · выходные ' + esc(last.off) : ''}</span></div>
      <div style="margin-top:6px">
        ${s ? `<div class="kv"><span>Услуги (Altegio)</span><b>${tg0(s)}</b></div>` : ''}
        ${s && pct ? `<div class="kv"><span>${pct}% от своих услуг</span><b>${tg0(s * pct / 100)}</b></div>` : ''}
        ${sal ? `<div class="kv"><span>Оклад</span><b>${tg0(sal)}</b></div>` : ''}
        ${tgt ? `<div class="kv"><span>Таргет</span><b>${tg0(tgt)}</b></div>` : ''}
        ${bon ? `<div class="kv"><span>Бонус ${cpct}% от услуг центра</span><b>${tg0(bon)}</b></div>` : ''}
        <div class="kv"><span><b>Положено</b></span><b class="gold">${tg0(acc)}</b></div>
        ${anyPaid ? `<div class="kv"><span>Выплачено (журнал)</span><b>${tg0(pd)}</b></div>
        ${noDebt ? `<div class="muted" style="margin-top:4px">${fired ? 'Уволена, расчёт закрыт: долг не показываем.' : 'Долг не считаем: часть записей в Altegio шла на других мастеров.'}</div>`
          : `<div class="kv"><span>${diff >= 0 ? 'Не доплачено' : 'Переплачено'}</span><b class="${Math.abs(diff) > 1000 ? 'over' : 'under'}">${tg0(Math.abs(diff))}</b></div>`}`
        : `<div class="muted" style="margin-top:4px">${/собствен/i.test(role) ? 'Выплат в журнале нет: собственник берёт из прибыли.' : 'Выплат за период в журнале нет.'}</div>`}
      </div></div>`;
  }).join('');
  $app.innerHTML = `
    <h1>Отчёты · ${esc(ME.client.name)}</h1>
    ${viewChips()}
    <div class="period">
      <label class="f" style="margin:0"><span>С месяца</span><select id="pf">${opts}</select></label>
      <label class="f" style="margin:0"><span>По месяц</span><select id="pt">${opts}</select></label>
    </div>
    <div class="muted" style="margin:0 6px 8px">За ${esc(mLabel(PFROM))} - ${esc(mLabel(PTO))}: положено и выплачено по журналу</div>
    ${idx.length ? cards : '<div class="card muted">За этот период данных нет. Факт есть по ' + esc(mLabel(R.factTo)) + '.</div>'}
    ${monthNow() > R.factTo ? `<h2>${MONTHS[new Date().getMonth()]}: месяц ещё идёт</h2><div class="muted" style="margin:-4px 6px 8px">Не входит в период выше: журнала за этот месяц ещё нет, считаем по Altegio.</div>${curMonthCard()}` : ''}
    <div class="muted" style="padding:0 6px">Условия и выходные на листе «Сотрудники», отпуска на листе «Табель» в таблице клиента. Выплаты из журнала администратора. Мастерам процент от услуг без предоплат.</div>`;
  bindViews();
  const pf = document.getElementById('pf'), pt = document.getElementById('pt');
  if (PFROM > R.factTo) PFROM = R.factTo;
  if (PTO > R.factTo) PTO = R.factTo;
  pf.value = PFROM; pt.value = PTO;
  pf.onchange = () => { PFROM = pf.value; if (PTO < PFROM) PTO = PFROM; drawStaff(); };
  pt.onchange = () => { PTO = pt.value; if (PFROM > PTO) PFROM = PTO; drawStaff(); };
  if (monthNow() > R.factTo) fillCurMonth();
}

// ---------- По дням: записи Altegio ----------
let DAYPER = 'week0', DAYDATA = null, DAYOPEN = '';
const WDS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
function dayRange(k) {
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (k === 'today') return [d0, d0];
  if (k === 'yest') { const y = new Date(d0); y.setDate(y.getDate() - 1); return [y, y]; }
  if (k === 'week0' || k === 'week1') {
    const mon = new Date(d0); mon.setDate(d0.getDate() - ((d0.getDay() + 6) % 7) - (k === 'week1' ? 7 : 0));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return [mon, sun];
  }
  const a = new Date(d0.getFullYear(), d0.getMonth() - (k === 'month1' ? 1 : 0), 1);
  return [a, new Date(a.getFullYear(), a.getMonth() + 1, 0)];
}
// Календарь выручки: чем ярче день, тем больше выручка
function heatCal(days, a, b) {
  const by = {}; days.forEach(d => { by[d.date] = d.sum; });
  const mx = Math.max(1, ...days.map(d => d.sum)), today = ymd(new Date());
  let h = '<div class="hm">' + ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => `<div>${w}</div>`).join('') + '<div></div>'.repeat((a.getDay() + 6) % 7);
  for (let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) {
    const k = ymd(d), v = by[k] || 0, f = v / mx;
    h += k > today ? `<i class="fut">${d.getDate()}</i>`
      : `<i data-day="${k}" title="${tg0(v)}" style="background:color-mix(in srgb, var(--accent) ${Math.round(10 + f * 90)}%, var(--bg2));${f > .55 ? 'color:#fff;' : ''}">${d.getDate()}</i>`;
  }
  return h + '</div><div class="row muted" style="font-size:11px;margin-top:6px"><span>меньше</span><span>нажмите день, чтобы открыть</span><span>больше</span></div>';
}

async function renderDays() {
  const [a, b] = dayRange(DAYPER), from = ymd(a), to = ymd(b);

      .map(([k, t]) => `<button class="chip ${k === DAYPER ? 'on' : ''}" data-dp="${k}">${t}</button>`).join('')}</div>`;

  const by = {};
  D.days.forEach(d => Object.keys(d.staff).forEach(n => { const x = by[n] || (by[n] = { sum: 0, visits: 0 }); x.sum += d.staff[n].sum; x.visits += d.staff[n].visits; }));

  }).join('');

    return `<div class="card doc" data-day="${d.date}" style="padding:12px">
      <div class="row"><b>${dm(dt)} ${WDS[dt.getDay()]}</b><b>${tg0(d.sum)}</b></div>

    </div>
    ${D.days.length > 1 ? `<h2>Выручка по дням</h2><div class="card">${heatCal(D.days, a, b)}</div>` : ''}
    <h2>Мастера и ЗП за период</h2>
    <div class="card" style="padding:10px"><table class="rep"><tbody>

    </tbody></table></div>

    <div class="muted" style="padding:6px">Из записей Altegio: только пришедшие клиенты, без продажи товаров. Оклад и таргет администратора делятся на её рабочие дни месяца (по выходным на листе «Сотрудники»).</div>`;
  bindHead();
  $app.querySelectorAll('[data-day]').forEach(c => c.onclick = () => { DAYOPEN = DAYOPEN === c.dataset.day ? '' : c.dataset.day; renderDays(); });

let YKIND = 'revenue';
function drawYears() {

// ====== Аналитика: что важно и на что обратить внимание, в бизнесе и в личном ======
let ANV = 'biz';
function anHead() {
  return `<h1>Аналитика ✦</h1><div class="chips seg">${[['biz', 'Бизнес'], ['pers', 'Личное'], ['all', 'Сводный']].filter(x => ME.user.approver || x[0] === 'pers').map(([k, t]) => `<button class="chip ${k === ANV ? 'on' : ''}" data-anv="${k}">${t}</button>`).join('')}</div>`;
}
function renderAn() {
  if (TAB !== 'an') return;
  if (!ME.user.approver) ANV = 'pers';   // без отчетов бизнеса: только личное
  if (ANV !== 'pers' && !REP) return load('reports', {}, { wait: () => { $app.innerHTML = anHead() + '<div class="center"><div class="spin"></div>Считаю…</div>'; }, alive: () => TAB === 'an', fail: failCard, draw: d => { REP = d; if (REP.months.length && !(REP.months.includes(PFROM) && REP.months.includes(PTO))) PFROM = PTO = REP.factTo || REP.months[REP.months.length - 1]; renderAn(); } });
  if (ANV !== 'biz' && !PDATA) return load('personal', {}, { wait: () => { $app.innerHTML = anHead() + '<div class="center"><div class="spin"></div>Считаю…</div>'; }, alive: () => TAB === 'an', fail: failCard, draw: d => { PDATA = d; renderAn(); } });
  if (ANV === 'pers') { PONLY = true; PTAB = 'an'; drawPersonal(); PONLY = false; return; }
  const R = REP, m = R.factTo, i = R.months.indexOf(m);
  if (i < 0) { $app.innerHTML = anHead() + '<div class="card muted">Фактических данных пока нет.</div>'; return; }
  const X = plCalc(R, [i]), Xp = i > 0 ? plCalc(R, [i - 1]) : null, F = X.F, Fp = Xp ? Xp.F : null;
  const ch = (a, b) => b ? Math.round((a / b - 1) * 100) : null;
  const sg = v => (v > 0 ? '+' : '') + v + '%';
  const items = [];   // {c: цвет, t: заголовок, v: значение, d: пояснение, w: вес}
  const add = (c, t, v, d, w) => items.push({ c, t, v, d, w });
  const rc = ch(F.rev, Fp && Fp.rev), pc = ch(F.rev, X.P.rev);
  if (rc !== null) add(rc <= -10 ? 'bad' : rc < 0 ? 'warn' : 'ok', 'Выручка', tg0(F.rev), `${sg(rc)} к ${mLabel(R.months[i - 1])}${pc !== null ? `, ${sg(pc)} к плану` : ''}.`, rc <= -10 ? 9 : 3);
  const mg = F.rev ? Math.round(F.net / F.rev * 100) : 0, nc = ch(F.net, Fp && Fp.net);
  add(mg < 15 ? 'bad' : mg < 30 ? 'warn' : 'ok', 'Чистая прибыль', tg0(F.net), `рентабельность ${mg}%${nc !== null ? `, ${sg(nc)} к прошлому месяцу` : ''}.`, mg < 15 ? 9 : nc !== null && nc <= -15 ? 7 : 2);
  const bep = F.rev && F.rev > F.vr ? F.fx / (1 - F.vr / F.rev) : 0;
  if (bep) { const z = F.rev / bep; add(z < 1.2 ? 'bad' : z < 1.5 ? 'warn' : 'ok', 'Точка безубыточности', tg0(bep), `запас прочности ${z.toFixed(1).replace('.', ',')}×: выручка может упасть на ${Math.max(0, Math.round((1 - 1 / z) * 100))}%, и центр останется без убытка.`, z < 1.5 ? 8 : 1); }

function attnHtml(s, t) {
  const items = [];
  const w = s.counts['На проверке'] || 0, e = s.counts['Ошибка распознавания'] || 0;
  if (w) items.push(['📄 Документы на проверке', w, 'wait']);
  if (e) items.push(['⚠️ Не распознались', e, 'err']);
  if (s.low && s.low.length) items.push(['🛒 Заканчивается на складе', s.low.length, 'buy']);
  const P = ME.user.personal ? (PDATA || cget(ckey('personal', {}))) : null;
  if (P) {
    const q = (P.todo || []).filter(x => !isDone(x)).length;
    if (q) items.push(['❓ Вопросы и платежи без ответа', q, 'personal']);
    const mm = monthNow(), rows = personalRows(P), lim = {};
    (P.ref || []).filter(x => x.kind === 'Лимит' && x.month > 0).forEach(x => { lim[x.name] = x.month; });
    Object.keys(lim).forEach(g => {
      const spent = -rows.filter(r => r.m === mm && r.sec === 'Траты' && r.grp === g).reduce((a, r) => a + r.sum, 0);
      if (spent > lim[g]) items.push([`💸 Лимит «${g}» превышен на ${tg0(spent - lim[g])}`, '', 'personal']);
    });
  }
  const unc = t && t.unconfirmed ? t.unconfirmed : [];
  if (unc.length) items.push(['📞 Не подтвердили запись на завтра', unc.length, 'unc']);
  const open = t && t.tasks ? t.tasks.filter(x => !x.done).length : 0;
  if (open) items.push(['📝 Задачи не выполнены', open, 'tasks']);
  if (!items.length) return t ? '<div class="under">Всё в порядке ✓</div>' : '<div class="muted">Проверяю…</div>';
  return items.map(([title, n, go]) => `<div class="kv doc" data-attn="${go}" style="padding:8px 0"><span>${esc(title)}</span><b>${n}${n === '' ? '' : ' ›'}</b></div>`
    + (go === 'unc' && UNC_OPEN ? uncHtml(unc) : '')).join('');
}
// Задачи и замечания: сотруднику свои открытые с кнопкой «Сделано»; проверяющим все + форма «Новая задача»
function tasksHtml(t, A) {
  if (!t) return '';
  const list = (t.tasks || []).slice().sort((a, b) => (!!a.done - !!b.done));
  const row = x => `<div style="border-top:1px solid var(--line);padding:8px 0" data-task="${esc(x.id)}">
    <div class="row"><span ${x.done ? 'class="muted" style="text-decoration:line-through"' : ''}>${esc(x.text)}</span>
      ${x.done ? (A ? `<button class="chip" data-tundo>вернуть</button>` : '') : `<button class="chip on" data-tdone>Сделано</button>`}</div>
    <div class="muted">${A ? esc(x.to) + ' · ' : ''}${x.due ? 'срок ' + esc(x.due) + ' · ' : ''}от ${esc(x.by)} ${esc(x.at)}${x.done ? ' · ✓ ' + esc(x.done) + (x.doneBy ? ' (' + esc(x.doneBy) + ')' : '') : ''}</div></div>`;
  if (!A) return list.length ? `<h2>Задачи и замечания</h2><div class="card">${list.map(row).join('')}</div>` : '';
  const ppl = t.people || [];
  return `<h2>Задачи</h2><div class="card">
    <div class="muted" style="margin-bottom:6px">Задачи ставят финансист и собственник: администратору, друг другу или себе. Получатель видит задачу в «Сводке», бот присылает сообщение. Администратор отметит «Сделано», вам придёт уведомление.</div>
    <select id="tkTo">${ppl.map(n => `<option>${esc(n)}</option>`).join('')}</select>
    <input id="tkText" placeholder="задача или замечание" style="margin-top:6px">
    <div style="display:flex;gap:6px;margin-top:6px"><input id="tkDue" type="date" style="flex:1"><button class="btn" id="tkAdd" style="width:auto;padding:8px 14px">Поставить</button></div>
    ${list.length ? list.slice(0, 30).map(row).join('') : '<div class="muted" style="margin-top:8px">Задач пока нет</div>'}</div>`;
}
function bindTasks() {
  const rd = () => {
    const el = document.getElementById('tdTasks'); if (el) { el.innerHTML = tasksHtml(TODAY, ME.user.approver); bindTasks(); }
    const at = document.getElementById('tdAttn'); if (at && LASTSUM) { at.innerHTML = attnHtml(LASTSUM, TODAY); bindAttn(); }
  };
  $app.querySelectorAll('[data-tdone],[data-tundo]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const id = b.closest('[data-task]').dataset.task, x = TODAY.tasks.find(q => q.id === id), undo = b.hasAttribute('data-tundo'), old = x.done;
    x.done = undo ? '' : new Date().toLocaleDateString('ru-RU'); x.doneBy = ME.user.name;
    if (!undo && !ME.user.approver) TODAY.tasks = TODAY.tasks.filter(q => q.id !== id);
    haptic('success'); rd(); cput(ckey('today', {}), TODAY);
    try { await api('taskDone', { id, undo }); } catch (err) { x.done = old; toast('Не сохранилось: ' + err.message); }
  });
  const add = document.getElementById('tkAdd');
  if (add) add.onclick = async () => {
    const to = document.getElementById('tkTo').value, text = document.getElementById('tkText').value.trim(), dv = document.getElementById('tkDue').value;
    if (!text) return toast('Напишите задачу');
    const due = dv ? dv.split('-').reverse().join('.') : '';
    add.disabled = true;
    try {
      const r = await api('taskAdd', { to, text, due });
      TODAY.tasks.unshift({ id: r.id, to, text, due, by: ME.user.name, at: new Date().toLocaleDateString('ru-RU'), done: '', doneBy: '' });
      cput(ckey('today', {}), TODAY); haptic('success'); toast('Задача поставлена'); rd();
    } catch (err) { toast(err.message); add.disabled = false; }
  };
}
function uncHtml(list) {
  return list.map(x => `<div style="border-top:1px solid var(--line);padding:6px 0 6px 8px">
    <div class="row"><b>${esc(x.time)} ${esc(x.client)}</b>${x.phone ? `<a href="tel:${esc(x.phone)}" style="color:var(--accent)">${esc(x.phone)}</a>` : ''}</div>
    <div class="muted">${esc([x.staff, x.services].filter(Boolean).join(' · '))}</div></div>`).join('');
}
function bindAttn() {
  $app.querySelectorAll('[data-attn]').forEach(c => c.onclick = () => {
    const g = c.dataset.attn;
    if (g === 'wait') { DOCFILTER = 'На проверке'; go('docs'); }
    else if (g === 'err') { DOCFILTER = 'Ошибка распознавания'; go('docs'); }
    else if (g === 'buy') go('buy');
    else if (g === 'personal') go('personal');
    else if (g === 'tasks') { const el = document.getElementById('tdTasks'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
    else if (g === 'unc') { UNC_OPEN = !UNC_OPEN; const el = document.getElementById('tdAttn'); if (el && TODAY) { el.innerHTML = attnHtml(LASTSUM, TODAY); bindAttn(); } }
  });
}

// ---------- Касса за день ----------
let CASH = null;
function cashHtml(c) {
  if (!c) return '<div class="muted">Считаю…</div>';
  const A = ME.user.approver, S = a => a.reduce((x, y) => x + y.sum, 0);
  const diffTxt = d => d === '' || d === null || d === undefined ? '' : Math.abs(d) < 1000 ? '<span class="under">сходится ✓</span>' : d < 0 ? `<span class="over">не хватает ${tg0(-d)}</span>` : `<span class="over">лишние ${tg0(d)}</span>`;
  const per = c.from === c.today ? 'сегодня' : `с ${c.from.slice(8, 10)}.${c.from.slice(5, 7)}`;
  let h = '';
  if (c.first) h += '<div class="muted" style="margin-bottom:6px">Первый подсчёт: введите, сколько наличных сейчас в кассе. Со следующего дня приложение будет сверять.</div>';
  else {
    h += `<div class="kv"><span>Было в кассе (${esc(c.last.date.slice(8, 10))}.${esc(c.last.date.slice(5, 7))})</span><b>${tg0(c.last.sum)}</b></div>`;
    h += c.revenue === null ? `<div class="muted">Наличная выручка из Altegio не пришла${c.revErr ? ': ' + esc(c.revErr) : ''}</div>` : `<div class="kv"><span>+ Наличными по Altegio ${per}</span><b>${tg0(c.revenue)}</b></div>`;
    h += `<div class="kv"><span>− Расходы наличными (через бота)</span><b>${tg0(S(c.expenses))}</b></div>`;
    h += c.expenses.map(x => `<div class="muted" style="padding-left:12px">${esc(x.what || x.id)} · ${tg0(x.sum)}</div>`).join('');
    h += `<div class="kv"><span>− Забрал собственник</span><b>${tg0(S(c.taken))}</b></div>`;
    if (c.expected !== null) h += `<div class="kv"><span><b>Должно быть в кассе</b></span><b class="gold">${tg0(c.expected)}</b></div>`;
  }
  if (c.counted) h += `<div class="kv" style="margin-top:6px"><span>Посчитано сегодня (${esc(c.counted.at)})</span><b>${tg0(c.counted.sum)}</b></div>${c.expected !== null && !c.first ? `<div style="text-align:right">${diffTxt(c.counted.sum - c.expected)}</div>` : ''}`;
  h += `<div style="display:flex;gap:6px;margin-top:8px"><input id="cashSum" inputmode="numeric" placeholder="сколько сейчас в кассе, ₸"><button class="btn" id="cashSave" style="width:auto;padding:8px 12px">${c.counted ? 'Пересчитать' : 'Сохранить'}</button></div>`;
  h += `<div style="display:flex;gap:6px;margin-top:6px"><input id="takeSum" inputmode="numeric" placeholder="Собственник забрал, ₸"><button class="btn sec" id="takeSave" style="width:auto;padding:8px 12px">Записать</button></div>`;
  h += '<div class="muted" style="margin-top:6px">Расходы наличными вносите через бота или «Расход без чека» со способом «Наличные», иначе касса не сойдётся.</div>';
  if (A && c.history && c.history.length) h += `<div style="margin-top:8px"><div class="muted">Последние подсчёты</div>${c.history.map(x => `<div class="kv"><span>${esc(x.date.slice(8, 10))}.${esc(x.date.slice(5, 7))} · ${esc(x.by)}</span><b>${tg0(x.sum)}</b></div>`).join('')}</div>`;
  return h;
}
function bindCash() {
  const put = c => { CASH = c; cput(ckey('cash', {}), c); const el = document.getElementById('tdCash'); if (el) { el.innerHTML = cashHtml(c); bindCash(); } };
  const go2 = async (kind, inputId, btnId) => {
    const v = Math.round(Number(String(document.getElementById(inputId).value).replace(/\s/g, '')) || 0);
    if (kind === 'take' && !v) return toast('Укажите сумму');
    if (kind === 'count' && document.getElementById(inputId).value.trim() === '') return toast('Укажите, сколько в кассе');
    const b = document.getElementById(btnId); b.disabled = true;
    try {
      const r = await api('cashSave', { kind, sum: v });
      haptic('success'); put(r);
      const d = r.saved && r.saved.diff;
      toast(kind === 'take' ? 'Записано' : d === '' ? 'Сохранено' : Math.abs(d) < 1000 ? 'Касса сходится ✓' : d < 0 ? 'Не хватает ' + tg0(-d) + ': возможно, не записан расход' : 'Лишние ' + tg0(d));
    } catch (e) { toast(e.message); b.disabled = false; }
  };
  const cs = document.getElementById('cashSave'); if (cs) cs.onclick = () => go2('count', 'cashSum', 'cashSave');
  const ts = document.getElementById('takeSave'); if (ts) ts.onclick = () => go2('take', 'takeSum', 'takeSave');
}
async function fillCash() {
  const key = ckey('cash', {});
  const put = c => { if (!c || TAB !== 'home' || CUR) return; CASH = c; const el = document.getElementById('tdCash'); if (el && !el.contains(document.activeElement)) { el.innerHTML = cashHtml(c); bindCash(); } };
  put(cget(key));
  try { const c = await api('cash', {}); cput(key, c); put(c); }
  catch (e) { const el = document.getElementById('tdCash'); if (el && !cget(key)) el.innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

// Altegio и записи на завтра: подгружаются после экрана (прошлые цифры из памяти телефона сразу)
let LASTSUM = null;
async function fillToday(s) {
  LASTSUM = s;
  const key = ckey('today', {});
  const put = t => {
    if (!t || TAB !== 'home' || CUR) return;
    TODAY = t;
    const now = new Date(), m = monthNow();
    if (ME.user.approver) {
      const alt = document.getElementById('tdAlt');
      if (alt && t.days) {
        const td = t.days.find(x => x.date === t.today) || { sum: 0, visits: 0 };

        const wk = t.days.filter(x => x.date >= wFrom), ms = t.days;

          ${ppl.length ? `<div class="muted" style="margin-top:6px">Положено на сегодня</div>${payHtml(ppl)}` : ''}

      } else if (alt && t.errDays) alt.innerHTML = `<div class="muted">Altegio: ${esc(t.errDays)}</div>`;
      const at = document.getElementById('tdAttn');
      if (at) { at.innerHTML = attnHtml(s, t); bindAttn(); }

      const u = document.getElementById('tdUnc');
      if (u) u.innerHTML = t.errUnconfirmed ? `<div class="muted">Altegio: ${esc(t.errUnconfirmed)}</div>`
        : t.unconfirmed.length ? `<div class="muted" style="margin-bottom:4px">${t.unconfirmed.length} ${plural(t.unconfirmed.length, 'запись', 'записи', 'записей')} без подтверждения. Позвоните или напишите клиенту.</div>${uncHtml(t.unconfirmed)}`
          : '<div class="under">Все записи на завтра подтверждены ✓</div>';
      const mi = document.getElementById('tdMine'), x = t.mine;
      if (mi) {

        else {
          const wAll = workdays(m, x.off), o = offDays(x.off);
          let wPast = 0; for (let k = 1; k <= now.getDate(); k++) if (!o.includes(new Date(now.getFullYear(), now.getMonth(), k).getDay())) wPast++;
          const part = x.tabelDays != null && wAll ? Math.min(1, x.tabelDays / wAll) : (wAll ? wPast / wAll : 1);
          const sal = x.salary * part, tgt = x.target * part, tot = x.own + sal + tgt + x.bonus;

            ${x.target ? `<div class="kv"><span>Таргет</span><b>${tg0(tgt)}</b></div>` : ''}
            ${x.centerPct ? `<div class="kv"><span>Бонус ${x.centerPct}% от услуг центра</span><b>${tg0(x.bonus)}</b></div>` : ''}
            <div class="kv"><span><b>Всего на сегодня</b></span><b class="gold">${tg0(tot)}</b></div>

function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; }
function shiftMonth(m, d) { let [y, mm] = m.split('-').map(Number); mm += d; if (mm < 1) { mm = 12; y--; } if (mm > 12) { mm = 1; y++; } return y + '-' + String(mm).padStart(2, '0'); }

}

// ====== Загрузка ======
function renderUpload() {
  $app.innerHTML = `
    <h1>Новый документ</h1>
    <div class="card">
      <label class="drop" for="file"><b>Сфотографировать или выбрать</b>накладная, чек, счёт-фактура, акт. Можно несколько страниц одного документа</label>
      <input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
      <label class="f"><span>Оплата</span><select id="pay">${ME.payments.map(p => `<option>${esc(p)}</option>`).join('')}</select></label>
      <label class="f"><span>Комментарий (необязательно)</span><textarea id="comment" placeholder="например: оплатила наличными из кассы"></textarea></label>
      <div class="btns"><button class="btn" id="send" disabled>Отправить на распознавание</button></div>
    </div>
    <div class="muted" style="padding:0 6px">Фото должно быть ровным и чётким, документ целиком в кадре. Распознавание занимает до минуты. Одностраничный чек можно просто отправить фото в чат бота.</div>`;
  PENDING_FILES = [];
  document.getElementById('file').onchange = async e => {
    for (const f of e.target.files) {
      if (PENDING_FILES.length >= 6) { toast('Не больше 6 страниц'); break; }
      try { PENDING_FILES.push(await prepareFile(f)); } catch (err) { toast(err.message); }
    }
    e.target.value = '';
    drawThumbs();
  };
  document.getElementById('send').onclick = sendUpload;
}
function drawThumbs() {
  const t = document.getElementById('thumbs');
  t.innerHTML = PENDING_FILES.map((f, i) => f.mime === 'application/pdf'
    ? `<div class="pdf" data-i="${i}">PDF ✕</div>`
    : `<img src="data:${f.mime};base64,${f.data}" data-i="${i}" alt="">`).join('');
  t.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { PENDING_FILES.splice(Number(el.dataset.i), 1); drawThumbs(); });
  document.getElementById('send').disabled = PENDING_FILES.length === 0;
}
function prepareFile(file) {
  return new Promise((resolve, reject) => {
    if (file.type === 'application/pdf') {
      if (file.size > 8 * 1024 * 1024) return reject(new Error('PDF больше 8 МБ'));
      const r = new FileReader();
      r.onload = () => resolve({ mime: 'application/pdf', data: String(r.result).split(',')[1] });
      r.onerror = () => reject(new Error('Не удалось прочитать файл'));
      return r.readAsDataURL(file);
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => reject(new Error('Это не фото'));
    img.src = url;
  });
}
async function sendUpload() {
  const pay = document.getElementById('pay').value, comment = document.getElementById('comment').value;
  const files = PENDING_FILES.slice();
  loading('Распознаю документ… обычно 20-60 секунд');
  try {
    const doc = await api('upload', { files, payment: pay, comment });
    haptic(doc.status === 'Ошибка распознавания' ? 'error' : 'success');
    PENDING_FILES = [];
    openDoc(doc.id);
  } catch (e) {
    if (e.message === 'no_access') return;
    haptic('error'); toast(e.message); renderUpload(); PENDING_FILES = files; drawThumbs();
  }
}

// ====== Список ======
let DPER = 'all', DOFF = 0;   // период списка: неделя, месяц или всё; DOFF = сдвиг назад
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dm(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0'); }
function docPeriod() {
  const now = new Date();
  if (DPER === 'week') {
    const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) + DOFF * 7);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    return { from: ymd(mon), to: ymd(sun), label: dm(mon) + '-' + dm(sun) };
  }
  if (DPER === 'month') {
    const a = new Date(now.getFullYear(), now.getMonth() + DOFF, 1), b = new Date(a.getFullYear(), a.getMonth() + 1, 0);
    return { from: ymd(a), to: ymd(b), label: MONTHS[a.getMonth()] + ' ' + a.getFullYear() };
  }
  return { from: '', to: '', label: 'за всё время' };
}
async function renderDocs() {
  const filters = ['На проверке', 'Утверждён', 'Отклонён', 'Ошибка распознавания', 'Все'];
  const p = docPeriod();
  $app.innerHTML = docBuyChips('docs') + `<div class="row"><h1>Документы</h1><div style="display:flex;gap:6px"><button class="btn sec" data-man style="width:auto;padding:9px 12px;font-size:14px">✍️ Без чека</button><button class="btn" data-up style="width:auto;padding:9px 12px;font-size:14px">📷 Загрузить</button></div></div>
    <div class="chips">${[['week', 'Неделя'], ['month', 'Месяц'], ['all', 'Всё время']].map(([k, t]) => `<button class="chip ${k === DPER ? 'on' : ''}" data-p="${k}">${t}</button>`).join('')}</div>
    ${DPER !== 'all' ? `<div class="row" style="margin:0 2px 8px"><div class="monthsw"><button data-o="-1">‹</button><b>${esc(p.label)}</b><button data-o="1" ${DOFF >= 0 ? 'disabled' : ''}>›</button></div></div>` : ''}
    <div class="chips">${filters.map(f => `<button class="chip ${f === DOCFILTER ? 'on' : ''}" data-f="${f}">${f}</button>`).join('')}</div>
    <div id="list"><div class="center"><div class="spin"></div></div></div>`;
  $app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { DOCFILTER = b.dataset.f; renderDocs(); });
  bindUpload();
  $app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { DPER = b.dataset.p; DOFF = 0; renderDocs(); });
  $app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { DOFF = Math.min(0, DOFF + Number(b.dataset.o)); renderDocs(); });
  const want = { status: DOCFILTER, from: p.from, to: p.to }, wkey = JSON.stringify(want);
  const $list = () => document.getElementById('list');
  return load('list', want, {
    alive: () => TAB === 'docs' && !CUR && !!$list() && JSON.stringify({ status: DOCFILTER, from: docPeriod().from, to: docPeriod().to }) === wkey,
    fail: e => { $list().innerHTML = `<div class="card">${esc(e.message)}</div>`; },
    draw: r => {
      const docs = withOvr(r.docs, want.status);
      const sum = docs.reduce((s, d) => s + (Number(d.total) || 0), 0);
      $list().innerHTML = docs.length
        ? `<div class="muted" style="margin:0 6px 8px">${docs.length} ${plural(docs.length, 'документ', 'документа', 'документов')} на ${money(sum)}${DOCFILTER === 'На проверке' && ME.user.approver ? ' · ✓ утверждает без открытия' : ''}</div><div class="dlist">${docs.map(docRow).join('')}</div>`
        : '<div class="card muted">Пусто</div>';
      bindDocCards();
    },
  });
}

// ====== Карточка документа ======
// Документ: поля из памяти телефона сразу (без фото), фото и свежие поля следом.
// Если уже начали править поля, свежие данные их не затирают, подставляются только фото.
let DIRTY = false;
async function openDoc(id) {
  CUR = id; DIRTY = false;
  if (tg) { tg.BackButton.show(); }
  const k = ckey('get', { id }), old = cget(k);
  if (old) { renderDoc(Object.assign({}, old, { photos: null })); refreshing(true); }
  else loading();
  try {
    const d = await api('get', { id });
    const lite = Object.assign({}, d); delete lite.photos;
    cput(k, lite);
    if (CUR !== id) return;
    if (!old || !DIRTY) { const y = window.scrollY; renderDoc(d); if (old) window.scrollTo(0, y); }
    else { const ph = document.querySelector('.photos'); if (ph) ph.innerHTML = photosHtml(d.photos); }
  } catch (e) {
    if (e.message === 'no_access' || CUR !== id) return;
    if (old) toast('Не удалось обновить: ' + e.message); else failCard(e);
  } finally { if (old) refreshing(false); }
}
function photosHtml(ph) {
  if (!ph) return '<div class="muted wait">Фото загружается…</div>';
  return ph.map(p => p.mime === 'application/pdf' ? '<div class="muted">PDF файл</div>' : `<img src="data:${p.mime};base64,${p.data}" alt="">`).join('');
}
// Утвердить или отклонить: сразу возвращаемся к списку, Google сохраняет в фоне; при ошибке документ откроется снова
function decideBg(d, ok, send) {
  const status = ok ? 'Утверждён' : 'Отклонён', back = TAB === 'home' ? 'home' : 'docs';
  OVR[d.id] = status; haptic('success'); toast((ok ? 'Утверждено: ' : 'Отклонено: ') + d.id);
  go(back);
  send().then(r => {
    if (r && r.altegioResult) toast('Altegio: ' + r.altegioResult);
  }).catch(e => {
    delete OVR[d.id]; haptic('error'); toast(d.id + (ok ? ' не утверждён: ' : ' не отклонён: ') + e.message);
    openDoc(d.id);
  });
}
function renderDoc(d) {
  const ro = d.canEdit ? '' : 'disabled';
  const opt = (arr, v) => arr.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const catOpts = v => `<option value=""></option>` + opt(ME.cats, v);
  $app.innerHTML = `
    <div class="row"><h1>${esc(d.id)}</h1>${badge(d.status)}</div>
    <div class="card">
      <div class="photos">${photosHtml(d.photos)}</div>
      <div class="muted" style="margin-top:6px">Загрузил(а) ${esc(d.uploader)}, ${esc(d.uploaded)}${d.reviewer ? ' · проверил(а) ' + esc(d.reviewer) : ''}</div>
    </div>
    <div class="card">
      <div class="${checkClass(d.check)}" style="font-weight:600">${esc(d.check || '')}</div>
      ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ''}
    </div>
    <div class="card" id="form">
      <div class="grid2">
        <label class="f"><span>Вид</span><select name="kind" ${ro}>${opt(ME.kinds, d.kind)}</select></label>
        <label class="f"><span>Номер</span><input name="number" value="${esc(d.number)}" ${ro}></label>
        <label class="f"><span>Дата (ДД.ММ.ГГГГ)</span><input name="date" value="${esc(d.date)}" inputmode="numeric" ${ro}></label>
        <label class="f"><span>Сумма, ₸</span><input name="total" value="${esc(d.total)}" inputmode="decimal" ${ro}></label>
      </div>
      <label class="f"><span>Контрагент</span><input name="counterparty" value="${esc(d.counterparty)}" ${ro}></label>
      <div class="grid2">
        <label class="f"><span>БИН/ИИН</span><input name="bin" value="${esc(d.bin)}" inputmode="numeric" ${ro}></label>
        <label class="f"><span>Оплата</span><select name="payment" ${ro}>${opt(ME.payments, d.payment)}</select></label>
      </div>
      <label class="f"><span>Статья</span><select name="category" ${ro}>${catOpts(d.category)}</select></label>
      <label class="f"><span>Комментарий</span><textarea name="comment" ${ro}>${esc(d.comment)}</textarea></label>
    </div>
    <h2>Строки документа · ${money(d.linesSum)}</h2>
    <div class="card"><table><tbody>${d.lines.map((l, i) => `
      <tr><td>${esc(l.name)}${d.canEdit
          ? `<select data-good="${i}" style="margin-top:4px;padding:6px;font-size:13px;width:100%"><option value="${esc(l.goodId)}">${l.goodId ? 'Altegio: ' + esc(l.goodTitle) : '— нет в Altegio —'}</option></select>`
          : `<div class="alt ${l.goodId ? 'yes' : 'no'}">${l.goodId ? 'Altegio: ' + esc(l.goodTitle) : 'нет в Altegio'}</div>`}
        ${d.canEdit ? `<select data-line="${i}" style="margin-top:4px;padding:6px;font-size:13px">${catOpts(l.category)}</select>` : `<div class="muted">${esc(l.category)}</div>`}</td>
      <td class="n">${d.canEdit
          ? `<input data-qty="${i}" value="${esc(l.qty)}" inputmode="decimal" style="width:64px;padding:4px 6px;font-size:13px;text-align:right"> ${esc(unitRu(l.unit))}`
          : `${esc(l.qty)} ${esc(unitRu(l.unit))}`}<div class="muted">× ${money(l.price)}</div></td>
      <td class="n"><b>${money(l.sum)}</b></td></tr>`).join('') || '<tr><td class="muted">Строк нет</td></tr>'}</tbody></table></div>
    ${d.altegio ? `<div class="card"><b>Altegio:</b> ${esc(d.altegio)}</div>` : ''}
    <div class="btns">
      ${d.canEdit ? '<button class="btn sec" id="save">Сохранить изменения</button>' : ''}
      ${d.canApprove ? '<input id="reason" placeholder="Причина, если отклоняете"><div class="btns two" style="margin:0"><button class="btn ok" id="approve">Утвердить</button><button class="btn bad" id="reject">Отклонить</button></div>' : ''}
      ${d.canEdit && d.status !== 'Утверждён' && d.kind !== 'Без документа' ? '<button class="btn sec" id="retry">Распознать заново</button>' : ''}
      ${ME.user.approver && d.status === 'Утверждён' && !d.altegioId ? '<button class="btn" id="toAltegio">Отправить в Altegio</button>' : ''}
    </div>`;
  const form = () => {
    const f = {};
    document.querySelectorAll('#form [name]').forEach(el => f[el.name] = el.value.trim());
    return f;
  };
  // Строка: товар Altegio и количество (например, пластырь купили 2 пачки, а приходуем 66 наборов)
  const lines = () => d.lines.map((l, i) => {
    const sel = document.querySelector(`[data-line="${i}"]`), gsel = document.querySelector(`[data-good="${i}"]`), qin = document.querySelector(`[data-qty="${i}"]`);
    const qty = qin ? (parseFloat(String(qin.value).replace(',', '.').replace(/\s/g, '')) || l.qty) : l.qty;
    const goodId = gsel ? gsel.value : l.goodId;
    const goodTitle = gsel ? (gsel.value ? gsel.selectedOptions[0].text.replace(/^Altegio: /, '') : '') : l.goodTitle;
    const price = qty && Number(qty) !== Number(l.qty) ? Math.round(Number(l.sum) / qty * 100) / 100 : l.price;
    return { name: l.name, qty, unit: l.unit, price, sum: l.sum, category: sel ? sel.value : l.category, goodId, goodTitle };
  });
  // Список товаров Altegio для выбора в строках (грузится один раз)
  const gsels = document.querySelectorAll('[data-good]');
  if (gsels.length) (window.GOODS_PICK ? Promise.resolve(window.GOODS_PICK) : api('goods').then(r => (window.GOODS_PICK = r.goods || [])))
    .then(list => gsels.forEach(s => {
      const cur = s.value, curT = s.options[0].text.replace(/^Altegio: /, '');
      s.innerHTML = '<option value="">— нет в Altegio —</option>' + list.map(g => `<option value="${esc(g.id)}">${esc(g.title)}</option>`).join('');
      if (cur && !list.some(g => String(g.id) === String(cur))) s.insertAdjacentHTML('beforeend', `<option value="${esc(cur)}">${esc(curT)}</option>`);
      s.value = cur;
    })).catch(() => {});
  const act = async (btn, fn, okText) => {
    const b = document.getElementById(btn); if (!b) return;
    b.onclick = async () => {
      b.disabled = true;
      try { const r = await fn(); haptic('success'); toast(okText + (r && r.altegioResult ? ' · Altegio: ' + r.altegioResult : '')); openDoc(d.id); }
      catch (e) { haptic('error'); toast(e.message); b.disabled = false; if (!document.body.contains(b)) openDoc(d.id); }
    };
  };
  document.querySelectorAll('#form [name], [data-line], [data-good], [data-qty], #reason').forEach(el => el.addEventListener('input', () => { DIRTY = true; }));
  act('save', () => api('update', { id: d.id, fields: form(), lines: d.canEdit ? lines() : undefined }), 'Сохранено');
  const ap = document.getElementById('approve');
  if (ap) ap.onclick = () => {
    const f = d.canEdit ? form() : { category: d.category, date: d.date };
    if (!f.category) { haptic('error'); return toast('Выберите статью'); }
    if (!f.date) { haptic('error'); return toast('Укажите дату документа'); }
    const ln = d.canEdit ? lines() : null;
    decideBg(d, true, async () => { if (d.canEdit) await api('update', { id: d.id, fields: f, lines: ln }); return api('approve', { id: d.id }); });
  };
  const rj = document.getElementById('reject');
  if (rj) rj.onclick = () => {
    const reason = document.getElementById('reason').value.trim();
    if (!reason) { haptic('error'); return toast('Напишите причину отклонения'); }
    decideBg(d, false, () => api('reject', { id: d.id, reason }));
  };
  act('retry', () => { loading('Распознаю заново…'); return api('retry', { id: d.id }); }, 'Распознано заново');
  act('toAltegio', async () => { const r = await api('sendAltegio', { id: d.id }); return { altegioResult: r.result }; }, 'Отправлено');
}

// ====== Клиент ======
function applyMe(me) {
  const changed = !ME || ME.client.code !== me.client.code;
  ME = me;
  CLIENT = ME.client.code;
  localStorage.setItem('client', CLIENT);
  document.title = ME.client.name;
  if (changed) { REP = null; DAYDATA = null; BUYDATA = null; }
  $nav.querySelector('[data-tab="reports"]').hidden = !ME.user.approver;
  $nav.querySelector('[data-tab="personal"]').hidden = !ME.user.personal;
  // собственнице и Арайлым: «Закупка» внутри «Документов», вместо нее кнопка «Аналитика»
  $nav.querySelector('[data-tab="an"]').hidden = !ME.user.personal;
  $nav.querySelector('[data-tab="buy"]').hidden = !!ME.user.personal;
  $nav.hidden = false;
}
// «Кто я» и Сводка одним обращением к Google; прошлые данные показываем сразу
async function boot(docParam) {
  const meKey = CK + UID + ':me:' + CLIENT;
  const oldMe = CLIENT ? cget(meKey) : null;
  let shown = false;
  const homeTab = () => { TAB = 'home'; CUR = null; if (tg) tg.BackButton.hide(); [...$nav.children].forEach(b => b.classList.toggle('on', b.dataset.tab === 'home')); };
  if (oldMe) {
    applyMe(oldMe);
    homeTab();
    const oldS = cget(ckey('summary', { month: MONTH }));
    if (oldS) { drawHome(oldS); shown = true; refreshing(true); }
    else loading();
    if (docParam) openDoc(docParam);
  } else loading('Подключаюсь…');
  try {
    const month = MONTH;
    const r = await api('start', { month });
    applyMe(r.me);
    cput(CK + UID + ':me:' + CLIENT, r.me);
    const sKey = ckey('summary', { month });
    const same = shown && JSON.stringify(cget(sKey)) === JSON.stringify(r.summary);
    cput(sKey, r.summary);
    if (!oldMe) { homeTab(); drawHome(r.summary); if (docParam) openDoc(docParam); }
    else if (TAB === 'home' && !CUR && MONTH === month && (!same || !shown)) { const y = window.scrollY; drawHome(r.summary); window.scrollTo(0, y); }
  } catch (e) {
    if (e.message === 'no_access') return;
    if (shown) toast('Не удалось обновить: ' + e.message);
    else $app.innerHTML = `<div class="card">Не удалось подключиться: ${esc(e.message)}</div>`;
  } finally { if (shown) refreshing(false); }
}
async function switchClient(code) {
  CLIENT = code;
  await boot();
}

// ====== Тема: темная или светлая, как в Telegram ======
// Выбор пользователя хранится на телефоне: 'tg' (как в Telegram), 'dark', 'light'
function themePref() { try { return localStorage.getItem('aray_theme') || 'tg'; } catch (e) { return 'tg'; } }
function setThemePref(v) { try { localStorage.setItem('aray_theme', v); } catch (e) {} applyTheme(); }
function themeChips() {
  const p = themePref();
  return `<h2>Тема</h2><div class="chips">${[['tg', 'Как в Telegram'], ['dark', 'Темная'], ['light', 'Светлая']]
    .map(([k, t]) => `<button class="chip ${k === p ? 'on' : ''}" data-theme="${k}">${t}</button>`).join('')}</div>`;
}
function applyTheme() {
  const q = new URLSearchParams(location.search).get('theme'), p = themePref();
  const light = q ? q === 'light' : p === 'tg' ? !!(tg && tg.colorScheme === 'light') : p === 'light';
  document.documentElement.classList.toggle('light', light);
  const bg = light ? '#eceef1' : '#0f1216', bar = light ? '#ffffff' : '#1a1e25';
  if (tg) {
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
    try { if (tg.setBottomBarColor) tg.setBottomBarColor(bar); } catch (e) {}
  }
}

// ====== Запуск ======
async function start() {
  if (tg) {
    tg.ready(); tg.expand();
    tg.BackButton.onClick(() => go(TAB === 'upload' || TAB === 'manual' ? 'docs' : TAB));
    applyTheme();
    try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
    // На телефоне: на весь экран, как в видео (Telegram 8.0 и новее). Свайп вниз не закрывает приложение.
    const mobile = ['ios', 'android', 'android_x'].includes(tg.platform);
    try { if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }
  if (!tg || !tg.initData) {
    $app.innerHTML = '<div class="card center"><h1>Финансы с Арайлым</h1><p>Откройте приложение через бота в Telegram.</p></div>';
    return;
  }
  await boot(new URLSearchParams(location.search).get('doc'));
}
start();
